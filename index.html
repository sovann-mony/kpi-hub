<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#111827; --muted:#6b7280;
    --border:#e5e7eb; --accent:#2563eb; --accent-text:#ffffff;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --chip:#eef2ff;
  }
  /* Pull Telegram theme colors when available */
  body.tg{
    --bg:var(--tg-theme-bg-color,#f3f4f6);
    --card:var(--tg-theme-secondary-bg-color,#ffffff);
    --text:var(--tg-theme-text-color,#111827);
    --muted:var(--tg-theme-hint-color,#6b7280);
    --accent:var(--tg-theme-button-color,#2563eb);
    --accent-text:var(--tg-theme-button-text-color,#ffffff);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:12px 12px 90px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 12px}
  header h1{font-size:18px;margin:0;font-weight:700}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--chip);color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:15px;
    background:var(--card);color:var(--text);font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  button{cursor:pointer;border:none;border-radius:10px;font-size:15px;font-weight:700;padding:12px 14px;font-family:inherit}
  .btn{background:var(--accent);color:var(--accent-text);width:100%}
  .btn.sec{background:var(--chip);color:var(--accent)}
  .btn.sm{width:auto;padding:7px 12px;font-size:13px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .pts{font-weight:700;color:var(--accent)}
  .muted{color:var(--muted);font-size:13px}
  .entry{border:1px solid var(--border);border-radius:12px;padding:11px;margin:8px 0;background:var(--card)}
  .entry .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .entry .merchant{font-weight:700}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .tag.pending{background:#fef3c7;color:#92400e}
  .tag.progress{background:#dbeafe;color:#1e40af}
  .tag.done{background:#dcfce7;color:#166534}
  .flag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
  .flag.below{background:var(--bad)} .flag.track{background:var(--ok)} .flag.over{background:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);
    display:flex;max-width:560px;margin:0 auto;z-index:20}
  nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 4px;font-size:11px;font-weight:600}
  nav button.active{color:var(--accent)}
  nav button .ic{display:block;font-size:19px;line-height:1.1}
  .hide{display:none}
  .notice{padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0}
  .notice.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .notice.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .center{text-align:center;padding:30px 10px;color:var(--muted)}
  h2.sec{font-size:15px;margin:4px 0 2px}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 KPI Hub</h1>
    <div class="who" id="who"></div>
  </header>
  <div id="app"><div class="center"><span class="spin"></span><div>Loading…</div></div></div>
</div>

<nav id="nav" class="hide">
  <button data-tab="log" class="active"><span class="ic">➕</span>Log Task</button>
  <button data-tab="mine"><span class="ic">📋</span>My Entries</button>
  <button data-tab="summary" id="navSummary"><span class="ic">📈</span>Summary</button>
  <button data-tab="admin" id="navAdmin"><span class="ic">⚙️</span>Admin</button>
</nav>

<script>
/* ============================================================
   KPI Hub — Telegram mini app  (Supabase backend)
   ============================================================ */
const SUPABASE_URL = "https://rhyzyurplrceihdqfwtx.supabase.co";
const SUPABASE_KEY = "sb_publishable_64PoRnyLVJQrcrkNTsOTKA_tPJthL-n";
const DAILY_DEFAULT = 40;

const REST = SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/";
const H = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

/* ---- tiny REST helpers (PostgREST) ---- */
async function sbGet(path){
  const r = await fetch(REST + path, {headers:H});
  if(!r.ok) throw new Error("GET "+path+" → "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbInsert(table, body){
  const r = await fetch(REST+table, {method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("INSERT "+table+" → "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbPatch(table, match, body){
  const r = await fetch(REST+table+"?"+match, {method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("PATCH "+table+" → "+r.status+" "+(await r.text()));
  return r.json();
}

/* ---- Telegram ---- */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
let TGUSER = null;
if(tg){
  try{ tg.ready(); tg.expand(); }catch(e){}
  document.body.classList.add("tg");
  TGUSER = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
}
// Fallback identity for testing in a normal browser (outside Telegram)
if(!TGUSER){
  TGUSER = { id: 999999, first_name: "Test", last_name: "User", username: "test" };
}
const TG_ID = TGUSER.id;
const TG_NAME = [TGUSER.first_name, TGUSER.last_name].filter(Boolean).join(" ") || TGUSER.username || ("User "+TG_ID);

/* ---- state ---- */
const S = { me:null, teams:[], supports:[], settings:{}, tab:"log" };
const app = document.getElementById("app");
const el = (h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;};
const roleName = {officer:"Officer",team_lead:"Team Lead",manager:"Manager",admin:"Admin"};
function teamName(id){const t=S.teams.find(t=>t.id===id);return t?t.name:"—";}
function teamColor(id){const t=S.teams.find(t=>t.id===id);return t?t.color:"#9ca3af";}
function canSeeSummary(){return S.me && ["team_lead","manager","admin"].includes(S.me.role);}
function isAdmin(){return S.me && S.me.role==="admin";}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- boot ---- */
async function boot(){
  try{
    S.teams    = await sbGet("teams?select=*&order=id");
    S.supports = await sbGet("support_types?select=*&active=eq.true&order=points.desc");
    const st   = await sbGet("settings?select=*");
    st.forEach(r=>S.settings[r.key]=r.value);
    await ensureUser();
    document.getElementById("nav").classList.remove("hide");
    if(!canSeeSummary()) document.getElementById("navSummary").classList.add("hide");
    if(!isAdmin())       document.getElementById("navAdmin").classList.add("hide");
    document.getElementById("who").innerHTML =
      esc(S.me.name)+"<br><span class='badge'>"+roleName[S.me.role]+"</span> "+
      "<span class='muted'>"+esc(teamName(S.me.team_id))+"</span>";
    wireNav();
    if(!S.me.team_id){ showOnboard(); } else { show("log"); }
  }catch(e){
    app.innerHTML = "<div class='notice err'>Could not connect to the database.<br><br>"+esc(e.message)+"</div>";
  }
}

async function ensureUser(){
  const rows = await sbGet("users?telegram_id=eq."+TG_ID+"&select=*");
  if(rows.length){ S.me = rows[0]; return; }
  // first-ever user becomes admin; everyone else starts as officer (team chosen on onboarding)
  const all = await sbGet("users?select=id");
  const role = all.length===0 ? "admin" : "officer";
  const made = await sbInsert("users", { telegram_id:TG_ID, name:TG_NAME, role:role, active:true });
  S.me = made[0];
}

/* ---- onboarding: pick your team ---- */
function showOnboard(){
  setActive(null);
  app.innerHTML="";
  const opts = S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  const c = el(`<div class="card">
    <h2 class="sec">👋 Welcome, ${esc(S.me.name)}</h2>
    <p class="muted">Before you start, choose the team you belong to. (An admin can change this later.)</p>
    <label>Your team</label>
    <select id="obTeam">${opts}</select>
    <div style="height:10px"></div>
    <button class="btn" id="obSave">Save & continue</button>
  </div>`);
  app.appendChild(c);
  document.getElementById("obSave").onclick = async ()=>{
    const tid = parseInt(document.getElementById("obTeam").value,10);
    try{
      const u = await sbPatch("users","id=eq."+S.me.id,{team_id:tid});
      S.me = u[0];
      document.getElementById("who").innerHTML =
        esc(S.me.name)+"<br><span class='badge'>"+roleName[S.me.role]+"</span> "+
        "<span class='muted'>"+esc(teamName(S.me.team_id))+"</span>";
      show("log");
    }catch(e){ alert("Error: "+e.message); }
  };
}

/* ---- nav ---- */
function wireNav(){
  document.querySelectorAll("#nav button").forEach(b=>{
    b.onclick=()=>show(b.dataset.tab);
  });
}
function setActive(tab){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
}
function show(tab){
  S.tab=tab; setActive(tab);
  if(tab==="log") renderLog();
  else if(tab==="mine") renderMine();
  else if(tab==="summary") renderSummary();
  else if(tab==="admin") renderAdmin();
}

/* ============================================================
   LOG TASK
   ============================================================ */
function renderLog(){
  const today = new Date().toISOString().slice(0,10);
  const stOpts = S.supports.map(s=>`<option value="${s.id}" data-pts="${s.points}">${esc(s.name)} (${s.points} pts)</option>`).join("");
  app.innerHTML="";
  const c = el(`<div class="card">
    <h2 class="sec">➕ Log a task</h2>
    <div id="logMsg"></div>
    <label>Start date</label>
    <input type="date" id="f_start" value="${today}">
    <label>Merchant name</label>
    <input id="f_merchant" placeholder="e.g. ABC Shop">
    <div class="row">
      <div><label>Contact</label><input id="f_contact" placeholder="name / phone"></div>
      <div><label>Service</label><input id="f_service" placeholder="service"></div>
    </div>
    <label>Category</label>
    <input id="f_category" placeholder="category">
    <label>Support type &nbsp;<span class="pts" id="ptsHint"></span></label>
    <select id="f_support">${stOpts}</select>
    <div class="row">
      <div><label>Status</label>
        <select id="f_status"><option>Pending</option><option>In Progress</option><option>Done</option></select>
      </div>
      <div><label>Resolved date</label><input type="date" id="f_resolved"></div>
    </div>
    <label>Remark</label>
    <textarea id="f_remark" placeholder="optional notes"></textarea>
    <div style="height:12px"></div>
    <button class="btn" id="saveEntry">Save entry</button>
    <p class="muted" style="margin-top:10px">Team: <b>${esc(teamName(S.me.team_id))}</b> · Logged as <b>${esc(S.me.name)}</b></p>
  </div>`);
  app.appendChild(c);
  const sel=document.getElementById("f_support"), hint=document.getElementById("ptsHint");
  const updPts=()=>{const o=sel.selectedOptions[0];hint.textContent=o?("= "+o.dataset.pts+" points"):"";};
  sel.onchange=updPts; updPts();
  document.getElementById("saveEntry").onclick=saveEntry;
}
async function saveEntry(){
  const msg=document.getElementById("logMsg");
  const merchant=document.getElementById("f_merchant").value.trim();
  if(!merchant){ msg.innerHTML="<div class='notice err'>Please enter a merchant name.</div>"; return; }
  const supId=parseInt(document.getElementById("f_support").value,10);
  const sup=S.supports.find(s=>s.id===supId);
  const btn=document.getElementById("saveEntry"); btn.disabled=true; btn.textContent="Saving…";
  try{
    await sbInsert("entries",{
      start_date: document.getElementById("f_start").value || null,
      merchant_name: merchant,
      contact: document.getElementById("f_contact").value.trim() || null,
      service: document.getElementById("f_service").value.trim() || null,
      category: document.getElementById("f_category").value.trim() || null,
      support_type_id: supId,
      points: sup ? sup.points : 0,
      status: document.getElementById("f_status").value,
      resolved_date: document.getElementById("f_resolved").value || null,
      remark: document.getElementById("f_remark").value.trim() || null,
      team_id: S.me.team_id,
      staff_telegram_id: TG_ID,
      staff_name: S.me.name
    });
    if(tg){ try{ tg.HapticFeedback.notificationOccurred("success"); }catch(e){} }
    renderLog();
    document.getElementById("logMsg").innerHTML="<div class='notice ok'>✅ Saved! ("+(sup?sup.points:0)+" points)</div>";
  }catch(e){
    msg.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>";
    btn.disabled=false; btn.textContent="Save entry";
  }
}

/* ============================================================
   MY ENTRIES
   ============================================================ */
async function renderMine(){
  app.innerHTML="<div class='center'><span class='spin'></span></div>";
  try{
    const rows=await sbGet("entries?staff_telegram_id=eq."+TG_ID+"&select=*,support_types(name)&order=created_at.desc&limit=100");
    const total=rows.reduce((a,r)=>a+(r.points||0),0);
    app.innerHTML="";
    app.appendChild(el(`<div class="card"><h2 class="sec">📋 My entries</h2>
      <p class="muted">${rows.length} tasks · <span class="pts">${total} points</span> total</p></div>`));
    if(!rows.length){ app.appendChild(el("<div class='center'>No entries yet. Log your first task!</div>")); return; }
    rows.forEach(r=>{
      const stc = r.status==="Done"?"done":(r.status==="In Progress"?"progress":"pending");
      const sup = r.support_types?r.support_types.name:"";
      const card=el(`<div class="entry">
        <div class="top">
          <div><div class="merchant">${esc(r.merchant_name||"(no name)")}</div>
            <div class="muted">${esc(sup)} · <span class="pts">${r.points||0} pts</span></div></div>
          <span class="tag ${stc}">${esc(r.status)}</span>
        </div>
        <div class="muted" style="margin-top:6px">Start: ${esc(r.start_date||"—")}${r.resolved_date?(" · Resolved: "+esc(r.resolved_date)):""}</div>
        ${r.remark?("<div style='margin-top:6px'>"+esc(r.remark)+"</div>"):""}
        <div style="margin-top:8px"><button class="btn sec sm" data-id="${r.id}">Change status</button></div>
      </div>`);
      card.querySelector("button").onclick=()=>changeStatus(r);
      app.appendChild(card);
    });
  }catch(e){ app.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
}
async function changeStatus(r){
  const next = r.status==="Pending"?"In Progress":(r.status==="In Progress"?"Done":"Pending");
  const body={status:next};
  if(next==="Done" && !r.resolved_date) body.resolved_date=new Date().toISOString().slice(0,10);
  try{ await sbPatch("entries","id=eq."+r.id,body); renderMine(); }
  catch(e){ alert("Error: "+e.message); }
}

/* ============================================================
   SUMMARY  (team totals vs target + flags)
   ============================================================ */
function monthKey(d){return d.toISOString().slice(0,7);}
async function renderSummary(){
  app.innerHTML="<div class='center'><span class='spin'></span></div>";
  const mk = S._month || monthKey(new Date());
  S._month = mk;
  try{
    const [y,m]=mk.split("-").map(Number);
    const from = `${mk}-01`;
    const to = new Date(y, m, 1).toISOString().slice(0,10); // first day of next month
    const entries = await sbGet(`entries?select=team_id,points,start_date&start_date=gte.${from}&start_date=lt.${to}&limit=5000`);
    const users   = await sbGet("users?select=team_id,active&active=eq.true");
    const cal     = await sbGet(`month_calendar?select=*&month=eq.${mk}`);
    const targets = await sbGet(`monthly_targets?select=*&month=eq.${mk}`);
    const daily = parseInt(S.settings.daily_target||DAILY_DEFAULT,10);
    const calRow = cal[0];
    const staffBy={}, actualBy={}, leaveBy={};
    users.forEach(u=>{ if(u.team_id) staffBy[u.team_id]=(staffBy[u.team_id]||0)+1; });
    entries.forEach(e=>{ if(e.team_id) actualBy[e.team_id]=(actualBy[e.team_id]||0)+(e.points||0); });
    targets.forEach(t=>{ leaveBy[t.team_id]=t.leave_days||0; });

    app.innerHTML="";
    // month selector
    const head=el(`<div class="card">
      <h2 class="sec">📈 Team summary</h2>
      <label>Month</label>
      <input type="month" id="mSel" value="${mk}">
      ${calRow?`<p class="muted" style="margin-top:8px">Working days: <b>${calRow.working_days}</b> · Holidays: <b>${calRow.holidays}</b></p>`
             :`<div class="notice err" style="margin-top:8px">No working days set for this month. Targets need Admin → set Month calendar.</div>`}
    </div>`);
    app.appendChild(head);
    document.getElementById("mSel").onchange=(e)=>{S._month=e.target.value;renderSummary();};

    // scope: managers/leads see their team(s); admin sees all
    let teamsToShow = S.teams;
    if(S.me.role==="team_lead") teamsToShow = S.teams.filter(t=>t.id===S.me.team_id);
    // (manager mapping to multiple teams can be added later; for now manager+admin see all)

    const tbl=el(`<div class="card"><table>
      <thead><tr><th>Team</th><th class="num">Staff</th><th class="num">Target</th><th class="num">Actual</th><th>Flag</th></tr></thead>
      <tbody id="sumBody"></tbody></table></div>`);
    app.appendChild(tbl);
    const body=tbl.querySelector("#sumBody");
    let tgtSum=0, actSum=0, rowsHtml="";
    teamsToShow.forEach(t=>{
      const staff=staffBy[t.id]||0;
      const actual=actualBy[t.id]||0;
      let target=null;
      if(calRow){
        const staffDays=(calRow.working_days-calRow.holidays)*staff-(leaveBy[t.id]||0);
        target=Math.max(0, Math.round(daily*Math.max(0,staffDays)));
      }
      let flag="";
      if(target!=null){
        if(actual<target) flag=`<span class="flag below">Below</span>`;
        else if(actual<=target*1.15) flag=`<span class="flag track">On track</span>`;
        else flag=`<span class="flag over">Over</span>`;
        tgtSum+=target; actSum+=actual;
      }
      rowsHtml += `<tr>`
        + `<td><span class="dot" style="background:${teamColor(t.id)}"></span>${esc(t.name)}</td>`
        + `<td class="num">${staff}</td>`
        + `<td class="num">${target==null?"—":target}</td>`
        + `<td class="num"><b>${actual}</b></td>`
        + `<td>${flag}</td></tr>`;
    });
    if(calRow && teamsToShow.length>1){
      rowsHtml += `<tr><td><b>Total</b></td><td class="num"></td>`
        + `<td class="num"><b>${tgtSum}</b></td><td class="num"><b>${actSum}</b></td><td></td></tr>`;
    }
    body.innerHTML = rowsHtml;
  }catch(e){ app.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
}

/* ============================================================
   ADMIN
   ============================================================ */
async function renderAdmin(){
  app.innerHTML="<div class='center'><span class='spin'></span></div>";
  try{
    const users=await sbGet("users?select=*&order=id");
    app.innerHTML="";
    app.appendChild(el(`<div class="card"><h2 class="sec">⚙️ Admin</h2>
      <p class="muted">Assign teams & roles, set points, and set monthly working days.</p></div>`));

    // --- Users ---
    const uc=el(`<div class="card"><h2 class="sec">👤 Staff (${users.length})</h2><div id="uList"></div></div>`);
    app.appendChild(uc);
    const uList=uc.querySelector("#uList");
    users.forEach(u=>{
      const teamOpts=S.teams.map(t=>`<option value="${t.id}" ${t.id===u.team_id?"selected":""}>${esc(t.name)}</option>`).join("");
      const roles=["officer","team_lead","manager","admin"];
      const roleOpts=roles.map(r=>`<option value="${r}" ${r===u.role?"selected":""}>${roleName[r]}</option>`).join("");
      const row=el(`<div class="entry">
        <div class="merchant">${esc(u.name||("User "+u.telegram_id))} ${u.active?"":"<span class='muted'>(inactive)</span>"}</div>
        <div class="row" style="margin-top:6px">
          <div><label>Team</label><select data-f="team">${teamOpts}</select></div>
          <div><label>Role</label><select data-f="role">${roleOpts}</select></div>
        </div>
        <div style="margin-top:8px"><button class="btn sec sm" data-save="${u.id}">Save</button></div>
      </div>`);
      row.querySelector("[data-save]").onclick=async()=>{
        const team=parseInt(row.querySelector("[data-f=team]").value,10);
        const role=row.querySelector("[data-f=role]").value;
        try{ await sbPatch("users","id=eq."+u.id,{team_id:team,role:role});
          const b=row.querySelector("[data-save]"); b.textContent="Saved ✓"; setTimeout(()=>b.textContent="Save",1200);
          if(u.id===S.me.id){ S.me.role=role; S.me.team_id=team; }
        }catch(e){ alert("Error: "+e.message); }
      };
      uList.appendChild(row);
    });

    // --- Support type points ---
    const sc=el(`<div class="card"><h2 class="sec">🎯 Support type points</h2><div id="sList"></div></div>`);
    app.appendChild(sc);
    const sList=sc.querySelector("#sList");
    S.supports.forEach(s=>{
      const row=el(`<div class="row" style="align-items:flex-end;margin:6px 0">
        <div style="flex:2"><div>${esc(s.name)}</div></div>
        <div><input type="number" value="${s.points}" data-pts="${s.id}"></div>
        <div style="flex:0 0 auto"><button class="btn sec sm" data-savep="${s.id}">Set</button></div>
      </div>`);
      row.querySelector("[data-savep]").onclick=async()=>{
        const v=parseInt(row.querySelector("[data-pts]").value,10)||0;
        try{ await sbPatch("support_types","id=eq."+s.id,{points:v}); s.points=v;
          const b=row.querySelector("[data-savep]"); b.textContent="✓"; setTimeout(()=>b.textContent="Set",1000);
        }catch(e){ alert("Error: "+e.message); }
      };
      sList.appendChild(row);
    });

    // --- Month calendar + team leave (targets) ---
    const mk=monthKey(new Date());
    const cal=await sbGet(`month_calendar?select=*&month=eq.${mk}`);
    const cRow=cal[0]||{working_days:"",holidays:0};
    const mc=el(`<div class="card"><h2 class="sec">📅 Month setup (${mk})</h2>
      <div class="row">
        <div><label>Working days</label><input type="number" id="mcWd" value="${cRow.working_days}"></div>
        <div><label>Holidays</label><input type="number" id="mcHol" value="${cRow.holidays||0}"></div>
      </div>
      <button class="btn sec sm" id="mcSave" style="margin-top:8px">Save month</button>
      <p class="muted" style="margin-top:6px">Target = ${S.settings.daily_target||DAILY_DEFAULT} × ((working−holidays) × staff − team leave)</p>
    </div>`);
    app.appendChild(mc);
    document.getElementById("mcSave").onclick=async()=>{
      const wd=parseInt(document.getElementById("mcWd").value,10)||0;
      const hol=parseInt(document.getElementById("mcHol").value,10)||0;
      try{
        if(cal.length) await sbPatch("month_calendar","month=eq."+mk,{working_days:wd,holidays:hol});
        else await sbInsert("month_calendar",{month:mk,working_days:wd,holidays:hol});
        const b=document.getElementById("mcSave"); b.textContent="Saved ✓"; setTimeout(()=>b.textContent="Save month",1200);
      }catch(e){ alert("Error: "+e.message); }
    };

    // --- Rename teams ---
    const tc=el(`<div class="card"><h2 class="sec">🏷️ Rename teams</h2><div id="tList"></div></div>`);
    app.appendChild(tc);
    const tList=tc.querySelector("#tList");
    S.teams.forEach(t=>{
      const row=el(`<div class="row" style="margin:6px 0">
        <div style="flex:3"><input value="${esc(t.name)}" data-tn="${t.id}"></div>
        <div style="flex:0 0 auto"><button class="btn sec sm" data-savet="${t.id}">Save</button></div>
      </div>`);
      row.querySelector("[data-savet]").onclick=async()=>{
        const v=row.querySelector("[data-tn]").value.trim(); if(!v) return;
        try{ await sbPatch("teams","id=eq."+t.id,{name:v}); t.name=v;
          const b=row.querySelector("[data-savet]"); b.textContent="✓"; setTimeout(()=>b.textContent="Save",1000);
        }catch(e){ alert("Error: "+e.message); }
      };
      tList.appendChild(row);
    });

  }catch(e){ app.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
}

boot();
</script>
</body>
</html>
