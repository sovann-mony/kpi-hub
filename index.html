<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI Hub</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f7fb}
  #ld{display:flex;height:100vh;align-items:center;justify-content:center;color:#64748b;font-size:14px}
  .ldspin{width:26px;height:26px;border:3px solid #e2e8f0;border-top-color:#4f46e5;border-radius:50%;
    animation:ldr 1s linear infinite;margin-right:10px}
  @keyframes ldr{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><span class="ldspin"></span>Loading…</div>
<script>
/* ============================================================
   KPI Hub LOADER  (do NOT edit to change the app — edit app.html)
   This tiny file is cached by Telegram once and rarely changes.
   On every open it fetches the latest app.html (cache-busted),
   so updating the app = just re-upload app.html. No version bumps.
   ============================================================ */
(async function(){
  try{
    var res = await fetch('app.html?t=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var txt = await res.text();
    var doc = new DOMParser().parseFromString(txt, 'text/html');

    // 1) copy styles + font links into our <head>
    doc.querySelectorAll('style, link[rel="stylesheet"], link[rel="preconnect"]').forEach(function(n){
      document.head.appendChild(n.cloneNode(true));
    });

    // 2) inject the app's body markup (scripts removed for now)
    var bodyClone = doc.body.cloneNode(true);
    bodyClone.querySelectorAll('script').forEach(function(s){ s.remove(); });
    document.body.innerHTML = bodyClone.innerHTML;

    // 3) run every script in document order (Telegram SDK first, app last)
    var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
    for(var i=0;i<scripts.length;i++){
      var s = scripts[i];
      var el = document.createElement('script');
      for(var j=0;j<s.attributes.length;j++){ el.setAttribute(s.attributes[j].name, s.attributes[j].value); }
      if(s.src){
        await new Promise(function(done){ el.onload = done; el.onerror = done; document.body.appendChild(el); });
      }else{
        el.textContent = s.textContent;
        document.body.appendChild(el);
      }
    }
  }catch(e){
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:24px;color:#991b1b">'
      + 'Could not load the app. Check your connection and reopen.<br><br>' + (e && e.message ? e.message : '') + '</div>';
  }
})();
</script>
</body>
</html>
