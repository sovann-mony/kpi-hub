      <button class="btn sec" data-cancel>Cancel</button>
      <button class="btn" id="et_save">Save</button>
    </div>
  </div></div>`);
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector('[data-x]').onclick=close; m.querySelector('[data-cancel]').onclick=close;
  m.onclick=(e)=>{ if(e.target===m) close(); };
  m.querySelector('#et_save').onclick=async()=>{
    const v=m.querySelector('#et_name').value.trim();
    if(!v){ m.querySelector('#etMsg').innerHTML="<div class='notice err'>Enter a team name.</div>"; return; }
    const uid=parseInt(m.querySelector('#et_unit').value,10);
    const b=m.querySelector('#et_save'); b.disabled=true; b.textContent="Saving…";
    try{ await sbPatch("teams","id=eq."+t.id,{name:v,unit_id:(uid||null)}); await reloadTeams(); close(); renderAdmin(true); }
    catch(e){ m.querySelector('#etMsg').innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; b.disabled=false; b.textContent="Save"; }
  };
  setTimeout(()=>{ const f=m.querySelector('#et_name'); if(f){ f.focus(); f.select(); } },50);
}
async function adUnits(host){
    // ===== Units =====
    const uc=el(`<div class="card"><h2 class="sec">🏢 Units</h2>
      <p class="muted" style="margin:2px 0 8px">Top level — each team belongs to a unit.</p>
      <div id="uList"></div>
      <div class="row" style="align-items:flex-end;margin-top:12px">
        <div style="flex:3"><label>New unit name</label><input id="uNew" placeholder="e.g. Risk Unit"></div>
        <div style="flex:0 0 auto"><button class="btn sec sm" id="uAdd">Add unit</button></div>
      </div>
    </div>`);
    host.appendChild(uc);
    const uList=uc.querySelector("#uList");
    if(!S.units.length) uList.innerHTML="<p class='muted'>No units yet. Add one below.</p>";
    S.units.forEach(u=>{
      const row=el(`<div class="row" style="align-items:center;margin:6px 0">
        <div style="flex:3"><b>${esc(u.name)}</b></div>
        <div style="flex:0 0 auto"><button class="btn sec sm" data-editu="${u.id}">Edit</button></div>
        <div style="flex:0 0 auto"><button class="btn danger sm" data-delu="${u.id}">Remove</button></div>
      </div>`);
      row.querySelector("[data-editu]").onclick=()=>editUnitModal(u);
      row.querySelector("[data-delu]").onclick=async()=>{
        const used=S.teams.filter(t=>t.unit_id===u.id).length;
        const warn=used?(" "+used+" team"+(used>1?"s":"")+" in it will show no unit until reassigned."):"";
        if(!(await askConfirm('Remove unit "'+u.name+'"?'+warn,{title:'Remove unit',ok:'Remove',danger:true}))) return;
        try{ await sbPatch("units","id=eq."+u.id,{active:false}); await reloadUnits(); renderAdmin(true); }
        catch(e){ alert("Error: "+e.message); }
      };
      uList.appendChild(row);
    });
    document.getElementById("uAdd").onclick=async()=>{
      const v=document.getElementById("uNew").value.trim(); if(!v) return;
      try{ await sbInsert("units",{name:v,active:true}); await reloadUnits(); renderAdmin(true); }
      catch(e){ alert("Error: "+e.message); }
    };

    // ===== Teams =====
    const unitOpts0='<option value="">— no unit —</option>'+S.units.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("");
    const tc=el(`<div class="card"><h2 class="sec">👥 Teams</h2>
      <p class="muted" style="margin:2px 0 8px">Assign each team to a unit.</p>
      <div id="tList"></div>
      <div class="row" style="align-items:flex-end;margin-top:12px;flex-wrap:wrap">
        <div style="flex:2;min-width:140px"><label>New team name</label><input id="tNew" placeholder="e.g. Team 7"></div>
        <div style="flex:2;min-width:140px"><label>Unit</label><select id="tNewUnit">${unitOpts0}</select></div>
        <div style="flex:0 0 auto"><button class="btn sec sm" id="tAdd">Add team</button></div>
      </div>
    </div>`);
    host.appendChild(tc);
    const tList=tc.querySelector("#tList");
    S.teams.forEach(t=>{
      const row=el(`<div class="litem">
        <div class="lname">${esc(t.name)} <span class="muted" style="font-weight:400">· ${esc(unitName(t.unit_id))}</span></div>
        <div class="uact">
          <button class="btn sec sm" data-editt="${t.id}">Edit</button>
          <button class="btn danger sm" data-delt="${t.id}">Remove</button>
        </div>
      </div>`);
      row.querySelector("[data-editt]").onclick=()=>editTeamModal(t);
      row.querySelector("[data-delt]").onclick=async()=>{
        if(!(await askConfirm('Remove team "'+t.name+'"? Existing records stay, but the team is hidden.',{title:'Remove team',ok:'Remove',danger:true}))) return;
        try{ await sbPatch("teams","id=eq."+t.id,{active:false}); await reloadTeams(); renderAdmin(true); }
        catch(e){ alert("Error: "+e.message); }
      };
      tList.appendChild(row);
    });
    document.getElementById("tAdd").onclick=async()=>{
      const v=document.getElementById("tNew").value.trim(); if(!v) return;
      const uid=parseInt(document.getElementById("tNewUnit").value,10);
      const color=PALETTE[S.teams.length % PALETTE.length];
      try{ await sbInsert("teams",{name:v,color:color,active:true,unit_id:(uid||null)}); await reloadTeams(); renderAdmin(true); }
      catch(e){ alert("Error: "+e.message); }
    };
}
function renderAdminUnlock(){
  app.innerHTML="";
  const c=el(`<div class="card" style="max-width:360px;margin:20px auto">
    <h2 class="sec">🔒 Confirm it's you</h2>
    <p class="muted">Re-enter your password to manage staff.</p>
    <div id="auMsg"></div>
    <input id="au_pass" type="password" placeholder="your password">
    <div style="height:10px"></div>
    <button class="btn" id="au_go">Unlock Admin</button>
  </div>`);
  app.appendChild(c);
  const go=async()=>{
    const p=document.getElementById("au_pass").value;
    const msg=document.getElementById("auMsg");
    if(!p){ msg.innerHTML="<div class='notice err'>Enter your password.</div>"; return; }
    const b=document.getElementById("au_go"); b.disabled=true; b.textContent="Checking…";
    try{
      const res=normLogin(await sbRpc("app_login",{p_username:AUTH.user.username,p_password:p}));
      if(res && res.ok && res.user){
        AUTH.pass=p;
        AUTH.user=Object.assign({},AUTH.user,res.user);           // refresh role/team from the server
        ls("kpihub_session",JSON.stringify(AUTH.user));
        if(AUTH.user.role!=="admin"){ startApp(); return; }      // no longer admin → back to normal app
        renderAdmin(); return;
      }
      if(res && res.reason==="locked"){
        logout();
        renderLogin("This account is locked after 3 failed attempts. Please reset your password using \"Forgot password?\" below.");
        return;
      }
      let m="Wrong password.";
      if(res && typeof res.remaining==="number" && res.remaining>0){ m+=" "+res.remaining+" attempt"+(res.remaining===1?"":"s")+" left before the account locks."; }
      msg.innerHTML="<div class='notice err'>"+esc(m)+"</div>";
    }catch(e){ msg.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
    b.disabled=false; b.textContent="Unlock Admin";
  };
  document.getElementById("au_go").onclick=go;
  document.getElementById("au_pass").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}
async function addStaff(){
  const msg=document.getElementById("addMsg");
  const name=document.getElementById("a_name").value.trim();
  const user=document.getElementById("a_user").value.trim();
  if(!name||!user){ msg.innerHTML="<div class='notice err'>Name and username are required.</div>"; return; }
  const role=document.getElementById("a_role").value;
  const unitVal=parseInt(document.getElementById("a_unit").value,10)||null;
  let teamId=parseInt(document.getElementById("a_team").value,10)||null;
  if(role==="officer"||role==="team_lead"){
    if(!teamId){ msg.innerHTML="<div class='notice err'>Please choose a Team for this role.</div>"; return; }
  } else if(role==="manager"){
    if(!unitVal){ msg.innerHTML="<div class='notice err'>Please choose a Unit for the Manager.</div>"; return; }
    if(!teamId){ const ft=S.teams.find(t=>t.unit_id===unitVal); teamId=ft?ft.id:null; }   // anchor to the unit so their unit scope works
  } else if(role==="admin"){
    teamId=null;   // admin isn't tied to a unit or team
  }
  const pass=genUserPass();
  const btn=document.getElementById("a_save"); btn.disabled=true; btn.textContent="Creating…";
  try{
    await sbRpc("app_save_user",{
      p_admin_user:AUTH.user.username, p_admin_pass:AUTH.pass,
      p_user_id:null, p_name:name, p_username:user, p_password:pass,
      p_team_id: teamId,
      p_role: role, p_active:true
    });
    try{ await sbRpc("app_flag_pw_change",{p_username:user}); }catch(e){}
    showCredsModal("User created", name, user, pass, ()=>renderAdmin(true));
  }catch(e){
    msg.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>";
    btn.disabled=false; btn.textContent="Create new user";
  }
}

async function bulkAdd(){
  const msg=document.getElementById("bulkMsg");
  const lines=document.getElementById("bulkText").value.split("\n").map(l=>l.trim()).filter(l=>l);
  if(!lines.length){ msg.innerHTML="<div class='notice err'>Paste at least one line.</div>"; return; }
  if(!AUTH.pass){ msg.innerHTML="<div class='notice err'>Re-open the Admin tab and confirm your password first.</div>"; return; }
  const btn=document.getElementById("bulkGo"); btn.disabled=true; btn.textContent="Creating…";
  const genPass=()=>"Kpi"+Math.random().toString(36).slice(2,7);
  const findTeam=(v)=>{ v=(v||"").trim(); if(!v) return null;
    const bn=S.teams.find(t=>t.name.toLowerCase()===v.toLowerCase()); if(bn) return bn.id;
    const n=parseInt(v,10); if(!isNaN(n)&&S.teams[n-1]) return S.teams[n-1].id; return null; };
  const roles=["officer","team_lead","manager","admin"];
  const results=[]; let ok=0;
  for(const line of lines){
    const c=line.split(",").map(x=>x.trim());
    const name=c[0], user=c[1]; let pass=(c[2]||""); if(!pass) pass=genPass();
    const team=findTeam(c[3]); const role=roles.includes((c[4]||"").toLowerCase())?c[4].toLowerCase():"officer";
    if(!name||!user){ results.push({line,ok:false,err:"missing name or username"}); continue; }
    try{
      await sbRpc("app_save_user",{p_admin_user:AUTH.user.username,p_admin_pass:AUTH.pass,p_user_id:null,
        p_name:name,p_username:user,p_password:pass,p_team_id:team,p_role:role,p_active:true});
      try{ await sbRpc("app_flag_pw_change",{p_username:user}); }catch(e){}
      results.push({name,user,pass,ok:true}); ok++;
    }catch(e){ results.push({line,ok:false,err:(e.message||"error")}); }
  }
  const rows=results.map(r=> r.ok
    ? `<tr><td>${esc(r.name)}</td><td><code>${esc(r.user)}</code></td><td><code>${esc(r.pass)}</code></td><td>✅</td></tr>`
    : `<tr><td colspan="3">${esc(r.line)} <span class="muted">(${esc(r.err)})</span></td><td>❌</td></tr>`).join("");
  msg.innerHTML=`<div class="notice ok">Created ${ok} of ${results.length}. Copy the usernames &amp; passwords below to give to users.</div>`
    +`<table><thead><tr><th>Name</th><th>Username</th><th>Password</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById("bulkText").value="";
  btn.disabled=false; btn.textContent="Create all";
}

boot();
</script>
