<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI Hub</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f6; --card:#ffffff; --text:#111827; --muted:#6b7280;
    --border:#e5e7eb; --accent:#2563eb; --accent-text:#ffffff;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --chip:#eef2ff; --maxw:560px;
  }
  body.tg{
    --bg:var(--tg-theme-bg-color,#f3f4f6);
    --card:var(--tg-theme-secondary-bg-color,#ffffff);
    --text:var(--tg-theme-text-color,#111827);
    --muted:var(--tg-theme-hint-color,#6b7280);
    --accent:var(--tg-theme-button-color,#2563eb);
    --accent-text:var(--tg-theme-button-text-color,#ffffff);
  }
  /* explicit day / night (overrides Telegram theme when chosen) */
  body.theme-light{ --bg:#f3f4f6;--card:#ffffff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--accent-text:#ffffff;--chip:#eef2ff; }
  body.theme-dark{ --bg:#0b1220;--card:#131c2e;--text:#e5e9f0;--muted:#8b98ad;--border:#263247;--accent:#3b82f6;--accent-text:#ffffff;--chip:#1b2a44; }
  .theme-toggle{ background:var(--chip);color:var(--accent);border-radius:999px;width:36px;height:36px;min-width:36px;padding:0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:12px 12px 92px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
  header h1{font-size:18px;margin:0;font-weight:700}
  .who{font-size:12px;color:var(--muted);text-align:right}
  .who a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--chip);color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:15px;
    background:var(--card);color:var(--text);font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  button{cursor:pointer;border:none;border-radius:10px;font-size:15px;font-weight:700;padding:12px 14px;font-family:inherit}
  .btn{background:var(--accent);color:var(--accent-text);width:100%}
  .btn.sec{background:var(--chip);color:var(--accent)}
  .btn.sm{width:auto;padding:7px 12px;font-size:13px}
  .btn.danger{background:#fef2f2;color:#b91c1c}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .pts{font-weight:700;color:var(--accent)}
  .muted{color:var(--muted);font-size:13px}
  .entry{border:1px solid var(--border);border-radius:12px;padding:11px;margin:8px 0;background:var(--card)}
  .entry .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .entry .merchant{font-weight:700}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .tag.pending{background:#fef3c7;color:#92400e}
  .tag.progress{background:#dbeafe;color:#1e40af}
  .tag.done{background:#dcfce7;color:#166534}
  .flag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
  .flag.below{background:var(--bad)} .flag.track{background:var(--ok)} .flag.over{background:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  nav{display:flex;background:var(--card);border:1px solid var(--border)}
  nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 4px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.active{color:var(--accent)}
  nav button .ic{display:flex;align-items:center;justify-content:center;line-height:1}
  nav button .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .navcap{display:none;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7b88a9;padding:2px 14px 10px}
  /* mobile: fixed bottom bar */
  nav.mobile{position:fixed;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;border-left:none;border-right:none;border-bottom:none;z-index:20}
  .hide{display:none}
  .notice{padding:10px 12px;border-radius:10px;font-size:13px;margin:8px 0}
  .notice.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .notice.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .center{text-align:center;padding:30px 10px;color:var(--muted)}
  h2.sec{font-size:15px;margin:4px 0 2px}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .login-box{max-width:380px;margin:6vh auto 0}
  .brand{text-align:center;margin-bottom:6px}
  .brand .big{font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:11px;letter-spacing:-.01em}
  .brand .big .logo{width:44px;height:44px;margin:0}
  .brandrow{display:flex;align-items:center}
  .brandrow span{letter-spacing:-.01em}
  .logo{width:1.4em;height:1.4em;margin-right:.4em;vertical-align:-0.32em;
    filter:drop-shadow(0 2px 6px rgba(59,130,246,.38))}

  /* ===== Wider layout: LEFT SIDEBAR nav (tablet / PC) ===== */
  @media (min-width:580px){
    :root{ --maxw:1180px; }
    header h1{ font-size:22px; }
    body:not(.auth) .wrap{
      display:grid; column-gap:20px; padding:16px 20px 28px;
      grid-template-columns:210px minmax(0,1fr);
      grid-template-areas:"head head" "nav main";
    }
    body:not(.auth) header{ grid-area:head; }
    body:not(.auth) #app{ grid-area:main; min-width:0; }
    body:not(.auth) nav{
      grid-area:nav; flex-direction:column; align-items:stretch;
      position:sticky; top:14px; align-self:start;
      min-height:calc(100vh - 28px); overflow-y:auto;
      border-radius:18px; margin:0;
      background:linear-gradient(180deg,#1f2a49 0%,#131a2e 100%); border:none;
      padding:16px 12px; box-shadow:0 16px 40px rgba(15,23,42,.24);
    }
    body:not(.auth) .navcap{ display:block; }
    body:not(.auth) nav button{ flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:11px;
      border:none; min-width:0; padding:12px 14px; font-size:14px; color:#aeb9d6; border-radius:12px; margin:2px 0; }
    body:not(.auth) nav button:hover{ background:rgba(255,255,255,.07); color:#fff; }
    body:not(.auth) nav button .ic{ display:flex; margin:0; }
    body:not(.auth) nav button .ic svg{ width:18px; height:18px; }
    .login-box{ margin-top:9vh; }
  }
  /* ===== Full desktop: 2-column forms ===== */
  @media (min-width:820px){
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; align-items:start; }
    .span2{ grid-column:1 / -1; }
  }

  /* ============ PREMIUM THEME ============ */
  :root{
    --accent:#4f46e5; --accent2:#2563eb; --bg:#f5f7fb; --border:#e9edf4; --chip:#eef1ff;
    --grad:linear-gradient(135deg,#6366f1 0%,#3b82f6 58%,#06b6d4 125%);
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);
    --shadow-lg:0 14px 44px rgba(15,23,42,.16);
    --ring:0 0 0 3px rgba(79,70,229,.18); --radius:16px;
  }
  body.theme-light{ --bg:#f5f7fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;--border:#e9edf4;--accent:#4f46e5;--accent-text:#fff;--chip:#eef1ff;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.06);--shadow-lg:0 14px 44px rgba(15,23,42,.16);--ring:0 0 0 3px rgba(79,70,229,.18); }
  body.theme-dark{ --bg:#070b16;--card:#111a2c;--text:#e8edf7;--muted:#90a0ba;--border:#223049;--accent:#818cf8;--accent-text:#0b1020;--chip:#1a2742;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);--shadow-lg:0 16px 46px rgba(0,0,0,.55);--ring:0 0 0 3px rgba(129,140,248,.35); }
  body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  header h1{font-weight:800;letter-spacing:-.02em}
  .card{border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  h2.sec{font-size:16px;font-weight:700;letter-spacing:-.01em}
  input,select,textarea{padding:12px 13px;border:1.5px solid var(--border);border-radius:12px;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  button{border-radius:12px;transition:transform .12s ease,box-shadow .15s ease,background .15s}
  .btn{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(59,130,246,.30)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(59,130,246,.40)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.65;transform:none;box-shadow:none}
  .btn.sec{background:var(--chip);color:var(--accent);box-shadow:none}
  .btn.sec:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .pts{font-weight:800}
  .entry{border-radius:14px;padding:13px;box-shadow:var(--shadow)}
  .entry .merchant{letter-spacing:-.01em}
  th{font-weight:700;letter-spacing:.04em}
  th,td{padding:10px 6px}
  tbody tr:last-child td{border-bottom:none}
  nav{box-shadow:var(--shadow)}
  nav button{transition:color .15s,background .15s,box-shadow .15s}
  nav.mobile{border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(15,23,42,.16);background:linear-gradient(180deg,#1f2a49 0%,#131a2e 100%);border:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  nav.mobile button{color:#aeb9d6;border-radius:12px;margin:0 2px}
  nav.mobile button.active{color:#fff;background:rgba(255,255,255,.10)}
  nav.mobile .navcap{display:none}
  .notice{border-radius:12px}
  .theme-toggle{width:38px;height:38px;min-width:38px;box-shadow:var(--shadow)}
  .theme-toggle:hover{transform:translateY(-1px)}
  .brandrow span{letter-spacing:-.02em;font-weight:800}
  .logo{width:1.5em;height:1.5em;filter:drop-shadow(0 3px 8px rgba(59,130,246,.4))}
  .brand .big{font-size:27px;gap:12px;letter-spacing:-.02em}
  .brand .big .logo{width:46px;height:46px}
  .login-box{max-width:390px}
  .login-box .card{box-shadow:var(--shadow-lg);border-radius:22px;padding:24px;position:relative;overflow:hidden}
  .login-box .card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad)}
  body.auth{background:radial-gradient(900px 440px at 50% -10%,rgba(99,102,241,.16),transparent 70%) var(--bg)}
  @media (min-width:580px){
    body:not(.auth) nav button{ position:relative; }
    body:not(.auth) nav button.active{ background:var(--grad); color:#fff; font-weight:700; box-shadow:0 8px 20px rgba(59,130,246,.34); }
    body:not(.auth) nav button.active:hover{ color:#fff; }
  }

  /* ===== Dashboard ===== */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .tile .tval{font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
  .tile .tlbl{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .barrow{display:flex;align-items:center;gap:10px;margin:10px 0}
  .barlbl{width:120px;flex:0 0 auto;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bartrack{flex:1;height:10px;background:var(--chip);border-radius:999px;overflow:hidden}
  .barfill{height:100%;border-radius:999px;transition:width .5s ease}
  .barval{width:48px;text-align:right;font-weight:800;font-size:13px}
  .statrow{display:flex;gap:8px;flex-wrap:wrap}
  .statrow .tag{font-size:13px;padding:5px 12px}
  .toprow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
  .toprow:last-child{border-bottom:none}
  .toprank{width:26px;height:26px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @media (min-width:580px){ .tiles{grid-template-columns:repeat(4,1fr)} }

  /* ===== Wider desktop + subtle page glow ===== */
  @media (min-width:1360px){ :root{ --maxw:1400px; } }
  @media (min-width:580px){ body:not(.auth){ background:radial-gradient(1100px 480px at 100% -8%, rgba(99,102,241,.07), transparent 62%) var(--bg); } }
  .card{transition:box-shadow .2s ease}

  /* ===== Staff list: single compact rows ===== */
  .urow{display:grid;grid-template-columns:1.6fr 1fr 1.1fr 0.9fr auto;gap:12px;align-items:center;padding:11px 6px;border-bottom:1px solid var(--border)}
  .litem{display:flex;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--border)}
  .litem:last-child{border-bottom:none}
  .litem .lname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .urow:last-child{border-bottom:none}
  .urow.uhead{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;border-bottom:2px solid var(--border);padding:2px 6px 8px}
  .urow .uname{font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .urow .uname .muted{font-weight:500}
  .urow select{padding:8px 10px;font-size:13px;border-radius:10px}
  .urow.inactive{opacity:.5}
  .uact{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{width:36px;height:36px;min-width:36px;padding:0;border-radius:10px;background:var(--chip);color:var(--accent);font-size:15px;
    display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
  .iconbtn:hover{transform:translateY(-1px)}
  .iconbtn.danger{background:#fef2f2;color:#dc2626}
  .iconbtn.ok{background:#f0fdf4;color:#16a34a}
  @media (max-width:579px){
    .urow{grid-template-columns:1fr 1fr;row-gap:8px}
    .urow .uname{grid-column:1 / -1}
    .uact{grid-column:1 / -1;justify-content:flex-start}
    .urow.uhead{display:none}
  }

  /* ===== My Entries single rows + status dropdown ===== */
  .erow{display:grid;grid-template-columns:1.8fr 1fr auto;gap:12px;align-items:center;padding:11px 6px;border-bottom:1px solid var(--border)}
  .erow:last-child{border-bottom:none}
  .erow .emer{font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .erow .emer .muted{font-weight:500}
  .erow .edate{font-size:12px}
  .estat{justify-self:end}
  .statsel{width:auto;min-width:98px;border-radius:999px;border:1.5px solid var(--border);padding:7px 10px;font-weight:700;font-size:13px;cursor:pointer}
  .statsel.done{background:#dcfce7;color:#166534;border-color:#bbf7d0}
  .statsel.pending{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
  .statsel.progress{background:#fef3c7;color:#92400e;border-color:#fde68a}
  span.statsel{display:inline-flex;align-items:center;justify-content:center;cursor:default;text-align:center}
  #mineFilterRow th{padding:4px 6px}
  #mineFilterRow input.fsearch{width:100%;padding:6px 8px;font-size:12px;font-weight:500;border-radius:8px}
  @media (max-width:579px){ .erow{grid-template-columns:1fr auto} .erow .edate{display:none} }

  /* ===== My performance bar ===== */
  .perfrow{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
  .perfrow .barlbl{width:120px;flex:0 0 auto;color:var(--accent);font-weight:700}
  .perfrow .bartrack{overflow:visible;height:12px;position:relative}
  .perfrow .barval{min-width:46px;text-align:right;font-weight:800;font-size:15px}
  .bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:2px;z-index:1}

  /* ===== My Entries full table ===== */
  .etable{min-width:920px}
  .etable.fit{min-width:0;width:100%}
  .etable.fit th,.etable.fit td{padding:10px 8px}
  .etable.compact{font-size:12px;min-width:1120px}
  .etable.compact th,.etable.compact td{padding:9px 8px}
  /* ===== Edit modal ===== */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:24px 16px;overflow:auto}
  .modal.modal-center{align-items:center}
  .modal .box::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);border-radius:20px 20px 0 0}
  .modal .box{position:relative}
  .modal .box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;max-width:580px;width:100%;box-shadow:var(--shadow-lg)}
  /* ===== Custom DD-MMM-YYYY date field ===== */
  .df{position:relative}
  .df .df-txt{width:100%;cursor:pointer}
  .df .df-date{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;border:none}
  .df:focus-within .df-txt{border-color:var(--accent);box-shadow:var(--ring)}
  .df.df-locked{opacity:.55}
  .df.df-locked .df-txt{cursor:not-allowed;background:var(--chip)}
  .combo{position:relative}
  .combo-input{width:100%;padding-right:30px}
  .combo-caret{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none}
  .combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-height:220px;overflow:auto;display:none}
  .combo-list.open{display:block}
  .combo-opt{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)}
  .combo-opt:last-child{border-bottom:none}
  .combo-opt:hover,.combo-opt.active{background:var(--chip);color:var(--accent)}
  .combo-empty{padding:10px 12px;color:var(--muted);font-size:13px}
  /* ===== Admin sub-tabs ===== */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .subnav button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .subnav button .ic{font-size:14px}
  .subnav button:hover{border-color:var(--accent);color:var(--accent)}
  .subnav button.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--shadow)}
  /* ===== Profile + header avatar ===== */
  .whorow{display:flex;align-items:center;gap:9px;justify-content:flex-end}
  .whotxt{text-align:right}
  .whoav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .whoav.whoavi{background:var(--grad);color:#fff;font-size:13px;font-weight:800}
  .pfavwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .pfav{width:92px;height:92px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;overflow:hidden;flex:0 0 auto;box-shadow:var(--shadow)}
  .pfav img{width:100%;height:100%;object-fit:cover}

<script>
/* ============================================================
   KPI Hub — Telegram mini app  (Supabase backend, username/password login)
   ============================================================ */
const SUPABASE_URL = "https://rhyzyurplrceihdqfwtx.supabase.co";
const SUPABASE_KEY = "sb_publishable_64PoRnyLVJQrcrkNTsOTKA_tPJthL-n";
const DAILY_DEFAULT = 40;

const LOGO = '<svg class="logo" viewBox="0 0 48 48" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="kpiG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="13" fill="url(#kpiG)"/><rect x="3.5" y="3.5" width="41" height="41" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity=".18"/><rect x="12" y="27" width="6.5" height="9" rx="2.2" fill="#ffffff" opacity=".72"/><rect x="20.75" y="22" width="6.5" height="14" rx="2.2" fill="#ffffff" opacity=".86"/><rect x="29.5" y="16" width="6.5" height="20" rx="2.2" fill="#ffffff"/><path d="M13 24.5 L23 19.5 L31.5 21.5 L37 13.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><circle cx="37" cy="13.5" r="2.4" fill="#ffffff"/></svg>';

const REST = SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/";
const H = { "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" };
const USER_COLS = "id,telegram_id,name,role,team_id,active,username"; // never password_hash

async function sbGet(path){
  const r = await fetch(REST+path, {headers:H});
  if(!r.ok) throw new Error("GET "+path+" → "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbInsert(table, body){
  const r = await fetch(REST+table, {method:"POST",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("INSERT "+table+" → "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbPatch(table, match, body){
  const r = await fetch(REST+table+"?"+match, {method:"PATCH",headers:{...H,"Prefer":"return=representation"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("PATCH "+table+" → "+r.status+" "+(await r.text()));
  return r.json();
}
async function sbRpc(fn, args){
  const r = await fetch(REST+"rpc/"+fn, {method:"POST",headers:H,body:JSON.stringify(args)});
  if(!r.ok) throw new Error((await r.text()) || ("RPC "+fn+" "+r.status));
  return r.json();
}
/* app_login works with BOTH the old DB (returns an array of rows) and the new
   DB (returns {ok,user,reason,remaining}). This keeps login working during the
   switch-over so there is no outage. */
function normLogin(res){
  if(Array.isArray(res)) return res.length ? {ok:true, user:res[0]} : {ok:false};
  return res || {ok:false};
}

/* ---- Telegram (theme/expand only; auth is username/password) ---- */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} document.body.classList.add("tg"); }

/* ---- theme (day / night) ---- */
function currentTheme(){
  let t=null; try{ t=localStorage.getItem("kpihub_theme"); }catch(e){}
  if(t!=="light" && t!=="dark"){
    t=(tg&&tg.colorScheme)?tg.colorScheme:((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");
  }
  return t;
}
function applyTheme(t){
  document.body.classList.remove("theme-light","theme-dark");
  document.body.classList.add(t==="dark"?"theme-dark":"theme-light");
  try{ localStorage.setItem("kpihub_theme",t); }catch(e){}
  const b=document.getElementById("themeBtn"); if(b) b.textContent=(t==="dark"?"☀️":"🌙");
}
applyTheme(currentTheme());
(function(){ const b=document.getElementById("themeBtn");
  if(b) b.onclick=()=>applyTheme(document.body.classList.contains("theme-dark")?"light":"dark"); })();

/* ---- state ---- */
const AUTH = { user:null, pass:null };               // pass kept in memory only
const S = { teams:[], units:[], supports:[], services:[], categories:[], settings:{}, tab:"log", _month:null };
const app = document.getElementById("app");
const nav = document.getElementById("nav");
const el = (h)=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;};
const roleName = {officer:"Officer",team_lead:"Team Lead",manager:"Manager",admin:"Admin"};
function teamName(id){const t=S.teams.find(t=>t.id===id);return t?t.name:"—";}
function unitName(id){const u=S.units.find(u=>u.id===id);return u?u.name:"—";}
function unitDaily(unitId){ const u=S.units.find(u=>u.id===unitId); const d=(u&&u.daily_target!=null)?parseInt(u.daily_target,10):NaN; return isNaN(d)?parseInt(S.settings.daily_target||DAILY_DEFAULT,10):d; }
function teamDaily(teamId){ const t=S.teams.find(t=>t.id===teamId); return unitDaily(t?t.unit_id:null); }
function teamColor(id){const t=S.teams.find(t=>t.id===id);return t?t.color:"#9ca3af";}
function canSeeSummary(){return AUTH.user && ["officer","team_lead","manager","admin"].includes(AUTH.user.role);}
function isAdmin(){return AUTH.user && AUTH.user.role==="admin";}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* only allow uploaded photos (data:image/...) as avatar sources */
function safeImg(v){ v=(v==null?"":String(v)); return /^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(v)?v:""; }
/* dates in LOCAL time (Cambodia UTC+7) — never toISOString(), which is UTC */
function pad2(n){ return (n<10?"0":"")+n; }
function localISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return localISO(new Date()); }
function nextMonthStart(mk){ const p=mk.split("-").map(Number); return localISO(new Date(p[0],p[1],1)); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){return null;} }

/* set nav layout responsive to width */
function applyNavMode(){ nav.classList.toggle("mobile", window.matchMedia("(max-width:579px)").matches); }
window.addEventListener("resize", applyNavMode);

/* ============================================================
   BOOT  →  login or app
   ============================================================ */
async function boot(){
  try{ document.getElementById("brandH").innerHTML = LOGO + '<span>KPI&nbsp;Hub</span>'; }catch(e){}
  try{
    S.teams    = await sbGet("teams?select=*&active=eq.true&order=id");
    S.units    = await sbGet("units?select=*&active=eq.true&order=id");
    S.supports = await sbGet("support_types?select=*&active=eq.true&order=points.desc");
    S.services = await sbGet("services?select=*&order=id");
    S.categories = await sbGet("categories?select=*&order=id");
    const st   = await sbGet("settings?select=*");
    st.forEach(r=>S.settings[r.key]=r.value);
    try{ const rl=await sbGet("role_labels?select=*"); rl.forEach(r=>{ if(roleName[r.role_key]!==undefined) roleName[r.role_key]=r.label; }); }catch(e){}
  }catch(e){
    app.innerHTML = "<div class='notice err'>Could not connect to the database.<br><br>"+esc(e.message)+"</div>";
    return;
  }
  const saved = ls("kpihub_session");
  if(saved){ try{ AUTH.user = JSON.parse(saved); }catch(e){} }
  if(AUTH.user) startApp(); else renderLogin();
}

/* ============================================================
   LOGIN
   ============================================================ */
function renderLogin(msg){
  nav.classList.add("hide");
  document.body.classList.add("auth");
  document.getElementById("who").innerHTML="";
  app.innerHTML="";
  const box = el(`<div class="login-box">
    <div class="brand"><div class="big">${LOGO}<span>KPI&nbsp;Hub</span></div><div class="muted">Please sign in</div></div>
    <div class="card">
      ${msg?`<div class="notice err">${esc(msg)}</div>`:""}
      <label>Username</label>
      <input id="li_user" autocomplete="username" autocapitalize="off" placeholder="your username">
      <label>Password</label>
      <input id="li_pass" type="password" autocomplete="current-password" placeholder="your password">
      <div style="height:12px"></div>
      <button class="btn" id="li_go">Sign in</button>
      <p class="muted" style="text-align:center;margin-top:12px"><a id="li_forgot">Forgot password?</a></p>
    </div>
  </div>`);
  app.appendChild(box);
  const go=()=>doLogin();
  document.getElementById("li_go").onclick=go;
  document.getElementById("li_pass").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  document.getElementById("li_forgot").onclick=()=>renderForgot();
}
function fnEdge(path, body){
  return fetch(SUPABASE_URL+"/functions/v1/"+path, {method:"POST", headers:{"Authorization":"Bearer "+SUPABASE_KEY,"apikey":SUPABASE_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body||{})})
    .then(async function(r){ const t=await r.text(); let j={}; try{ j=JSON.parse(t); }catch(e){ j={ok:false,error:(t||("HTTP "+r.status))}; } return j; })
    .catch(function(e){ return {ok:false,error:(e&&e.message)||"Network error"}; });
}
function renderForgot(){
  const st={ user:"", masked:"", code:"" };
  function msg(t){ const m=document.getElementById("fpMsg"); if(m) m.innerHTML=t?("<div class='notice err'>"+esc(t)+"</div>"):""; }
  function msgOk(t){ const m=document.getElementById("fpMsg"); if(m) m.innerHTML="<div class='notice ok'>"+esc(t)+"</div>"; }
  function shell(o){
    document.body.classList.add("auth"); nav.classList.add("hide"); document.getElementById("who").innerHTML="";
    app.innerHTML="";
    const box=el("<div class='login-box'><div class='brand'><div class='big'>"+LOGO+"<span>KPI&nbsp;Hub</span></div></div>"
      +"<div class='card'><div class='fphd'><button class='iconbtn' id='fpBack' title='Back'>←</button><h2 class='sec' style='margin:0'>"+esc(o.title)+"</h2></div>"
      +"<p class='muted' style='margin:0 0 12px'>"+esc(o.sub)+"</p><div id='fpMsg'></div>"+o.html+"</div></div>");
    app.appendChild(box);
    document.getElementById("fpBack").onclick=o.onBack||function(){renderLogin();};
    if(o.wire) o.wire();
  }
  function stepUser(){
    shell({ title:"Forgot password", sub:"Please enter your username to reset your password.",
      html:"<label>Username</label><input id='fp_user' autocapitalize='off' placeholder='Enter your username' value='"+esc(st.user)+"'><p class='muted' style='margin:6px 0 0'>The same username you use to sign in.</p><div style='height:12px'></div><button class='btn' id='fp_go'>Reset Password</button>",
      onBack:function(){renderLogin();},
      wire:function(){
        const go=async function(){
          const v=document.getElementById("fp_user").value.trim();
          if(!v){ msg("Please enter your username."); return; }
          st.user=v; const b=document.getElementById("fp_go"); b.disabled=true; b.textContent="Sending…";
          const r=await fnEdge("send-reset-otp",{username:v});
          if(r && r.ok && r.sent){ st.masked=r.masked||""; stepOtp(); }
          else if(r && r.ok && !r.sent){ msg("That username doesn't exist, or has no email set. Please check it and try again, or ask your admin."); b.disabled=false; b.textContent="Reset Password"; }
          else { msg((r&&r.error)||"Could not send the code. Please try again."); b.disabled=false; b.textContent="Reset Password"; }
        };
        document.getElementById("fp_go").onclick=go;
        document.getElementById("fp_user").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
        document.getElementById("fp_user").focus();
      } });
  }
  function stepOtp(){
    shell({ title:"Enter OTP", sub:"Please enter the OTP sent to your registered email"+(st.masked?(" "+st.masked):"")+".",
      html:"<div class='otpwrap' id='fp_otp'>"+[0,1,2,3,4,5].map(function(i){return "<input class='otpin' maxlength='1' inputmode='numeric' data-i='"+i+"'>";}).join("")+"</div><div style='height:14px'></div><button class='btn' id='fp_verify'>Verify Code</button><p class='muted' style='text-align:center;margin-top:12px'>Haven't got the OTP yet? <a id='fp_resend'>Resend OTP</a></p>",
      onBack:function(){stepUser();},
      wire:function(){
        const ins=Array.prototype.slice.call(document.querySelectorAll("#fp_otp .otpin"));
        const code=function(){ return ins.map(function(i){return i.value;}).join(""); };
        const verify=async function(){
          const c=code(); if(c.length<6){ msg("Enter the 6-digit code."); return; }
          const b=document.getElementById("fp_verify"); b.disabled=true; b.textContent="Verifying…";
          const r=await sbRpc("app_verify_reset",{p_username:st.user,p_code:c});
          if(r&&r.ok){ st.code=c; stepPass(); } else { msg((r&&r.error)||"Incorrect code."); b.disabled=false; b.textContent="Verify Code"; }
        };
        ins.forEach(function(inp,idx){
          inp.addEventListener("input",function(){ inp.value=inp.value.replace(/\D/g,""); if(inp.value&&idx<5) ins[idx+1].focus(); });
          inp.addEventListener("keydown",function(e){ if(e.key==="Backspace"&&!inp.value&&idx>0) ins[idx-1].focus(); if(e.key==="Enter") verify(); });
        });
        ins[0].addEventListener("paste",function(e){ const d=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"").slice(0,6); if(d){ e.preventDefault(); d.split("").forEach(function(ch,i){ if(ins[i]) ins[i].value=ch; }); ins[Math.min(d.length,5)].focus(); } });
        ins[0].focus();
        document.getElementById("fp_verify").onclick=verify;
        document.getElementById("fp_resend").onclick=async function(){ msg(""); const r=await fnEdge("send-reset-otp",{username:st.user}); if(r&&r.ok){ st.masked=r.masked||st.masked; msgOk("A new code has been sent."); } else { msg((r&&r.error)||"Could not resend."); } };
      } });
  }
  function stepPass(){
    shell({ title:"Set a new password", sub:"Create a new password. Ensure it differs from previous ones for security.",
      html:"<label>Password</label><input id='fp_p1' type='password' placeholder='Enter your new password'><label>Confirm Password</label><input id='fp_p2' type='password' placeholder='Re-enter password'><div style='height:12px'></div><button class='btn' id='fp_upd'>Update Password</button>",
      onBack:function(){stepOtp();},
      wire:function(){
        const upd=async function(){
          const p1=document.getElementById("fp_p1").value, p2=document.getElementById("fp_p2").value;
          if(p1.length<6){ msg("Password must be at least 6 characters."); return; }
          if(p1!==p2){ msg("Passwords do not match."); return; }
          const b=document.getElementById("fp_upd"); b.disabled=true; b.textContent="Updating…";
          const r=await sbRpc("app_reset_password",{p_username:st.user,p_code:st.code,p_newpass:p1});
          if(r&&r.ok){ stepDone(); } else { msg((r&&r.error)||"Could not update password."); b.disabled=false; b.textContent="Update Password"; }
        };
        document.getElementById("fp_upd").onclick=upd;
        document.getElementById("fp_p2").addEventListener("keydown",function(e){if(e.key==="Enter")upd();});
        document.getElementById("fp_p1").focus();
      } });
  }
  function stepDone(){
    document.body.classList.add("auth"); nav.classList.add("hide"); document.getElementById("who").innerHTML="";
    app.innerHTML="";
    const box=el("<div class='login-box'><div class='card' style='text-align:center'><div class='okcircle'>✓</div><h2 class='sec' style='margin:14px 0 6px'>Successful</h2><p class='muted'>Your password has been successfully updated. Click Continue to sign in.</p><div style='height:14px'></div><button class='btn' id='fp_cont'>Continue</button></div></div>");
    app.appendChild(box);
    document.getElementById("fp_cont").onclick=function(){renderLogin();};
  }
  stepUser();
}
async function doLogin(){
  const u=document.getElementById("li_user").value.trim();
  const p=document.getElementById("li_pass").value;
  if(!u||!p){ renderLogin("Enter username and password."); return; }
  const btn=document.getElementById("li_go"); btn.disabled=true; btn.textContent="Signing in…";
  try{
    const res = normLogin(await sbRpc("app_login",{p_username:u,p_password:p}));
    if(res && res.ok && res.user){
      AUTH.user = res.user; AUTH.pass = p;
      if(res.user.must_change_password){ renderFirstPassword(); return; }
      ls("kpihub_session", JSON.stringify(AUTH.user));
      startApp();
    }else if(res && res.reason==="locked"){
      renderLogin("This account is locked after 3 failed attempts. Please reset your password using \"Forgot password?\" below.");
    }else{
      let m="Wrong username or password.";
      if(res && typeof res.remaining==="number" && res.remaining>0){ m+=" "+res.remaining+" attempt"+(res.remaining===1?"":"s")+" left before the account locks."; }
      renderLogin(m);
    }
  }catch(e){
    renderLogin("Login error: "+e.message);
  }
}
function logout(){ AUTH.user=null; AUTH.pass=null; ls("kpihub_session",null); renderLogin(); }
/* First login: user must set their own password (min 6 chars) before entering. */
function renderFirstPassword(){
  nav.classList.add("hide");
  document.body.classList.add("auth");
  document.getElementById("who").innerHTML="";
  app.innerHTML="";
  const box=el(`<div class="login-box">
    <div class="brand"><div class="big">${LOGO}<span>KPI&nbsp;Hub</span></div><div class="muted">Set your password</div></div>
    <div class="card">
      <h2 class="sec" style="margin:0 0 4px">Create a new password</h2>
      <p class="muted" style="margin:0 0 12px">For security, please set your own password before continuing. At least 6 characters.</p>
      <div id="fpcMsg"></div>
      <label>New password</label>
      <input id="fpc_p1" type="password" autocomplete="new-password" placeholder="Enter a new password">
      <label>Confirm new password</label>
      <input id="fpc_p2" type="password" autocomplete="new-password" placeholder="Re-enter password">
      <div style="height:12px"></div>
      <button class="btn" id="fpc_go">Save &amp; continue</button>
    </div>
  </div>`);
  app.appendChild(box);
  const go=async()=>{
    const msg=document.getElementById("fpcMsg");

function resizeImage(file, max, cb){
  try{
    const r=new FileReader();
    r.onload=function(){ const img=new Image(); img.onload=function(){
      let w=img.width,h=img.height; const sc=Math.min(1, max/Math.max(w,h)); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      try{ cb(cv.toDataURL("image/jpeg",0.82)); }catch(e){ alert("Could not process that image."); } };
      img.onerror=function(){ alert("That file is not a valid image."); }; img.src=r.result; };
    r.readAsDataURL(file);
  }catch(e){ alert("Could not read the file."); }
}

/* reusable chips input: Enter/comma adds, × or Backspace removes; list stored on container._list */
function wireChipInput(inputId, chipsId){
  const inp=document.getElementById(inputId), box=document.getElementById(chipsId);
  if(!inp||!box) return;
  const list=[]; box._list=list;
  function render(){
    box.innerHTML=list.map((n,i)=>`<span class="chip">${esc(n)}<button type="button" data-i="${i}" title="Remove">×</button></span>`).join("");
    box.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{ list.splice(parseInt(b.dataset.i,10),1); render(); });
  }
  function add(v){ v=(v||"").trim(); if(!v) return; if(!list.some(x=>x.toLowerCase()===v.toLowerCase())) list.push(v); render(); }
  inp.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"||e.key===","){ e.preventDefault(); add(inp.value); inp.value=""; }
    else if(e.key==="Backspace" && !inp.value && list.length){ list.pop(); render(); }
  });
}
/* collect chips list + any text still typed in the input (so single values work without Enter) */
function collectChips(inputId, chipsId){
  const box=document.getElementById(chipsId);
  const list=(box&&box._list)?box._list.slice():[];
  const typed=(document.getElementById(inputId).value||"").trim();
  if(typed && !list.some(x=>x.toLowerCase()===typed.toLowerCase())) list.push(typed);
  return list;
}
/* simple centered popup for errors */
function showAlert(message, title){
  const m=el(`<div class="modal modal-center"><div class="box" style="max-width:380px">
    <h2 class="sec">${esc(title||"Can't save")}</h2>
    <p class="muted" style="margin:8px 0 16px">${esc(message)}</p>
    <div class="row"><button class="btn" data-ok>OK</button></div>
  </div></div>`);
  document.body.appendChild(m);
  const done=()=>m.remove();
  m.querySelector("[data-ok]").onclick=done;
  m.onclick=(e)=>{ if(e.target===m) done(); };
}
async function saveEntry(){
  const msg=document.getElementById("logMsg");
  const err=(t)=>{ showAlert(t,"Missing information"); };
  const startDate=document.getElementById("f_start").value;
  if(!startDate){ err("Please choose a start date."); return; }
  const merchants=collectChips("f_merchant","merchantChips");
  if(!merchants.length){ err("Please enter at least one merchant name."); return; }
  const contact=document.getElementById("f_contact").value.trim();
  if(!contact){ err("Please enter the contact."); return; }
  const service=document.getElementById("f_service").value.trim();
  if(!service){ err("Please choose a service."); return; }
  const category=document.getElementById("f_category").value.trim();
  if(!category){ err("Please choose a category."); return; }
  const supId=parseInt(document.getElementById("f_support").value,10);
  if(!supId){ err("Please choose a task."); return; }
  const remarks=collectChips("f_remark","remarkChips");   // optional
  // restriction: can't use multiple merchants AND multiple remarks together
  if(merchants.length>1 && remarks.length>1){
    showAlert("You can't use multiple merchants and multiple remarks at the same time. Please keep one of them as a single value.","Not allowed");
    return;
  }
  const sup=S.supports.find(s=>s.id===supId);
  const statusVal=document.getElementById("f_status").value;
  const resolvedVal=document.getElementById("f_resolved").value;
  if(statusVal==="Done" && !resolvedVal){ err("Please set the Resolved date — it's required when the status is Done."); return; }
  if(resolvedVal && resolvedVal < startDate){ err("Resolved date must be on or after the start date."); return; }
  const btn=document.getElementById("saveEntry"); btn.disabled=true; btn.textContent="Saving…";
  try{
    const base={
      start_date: startDate,
      contact: contact,
      service: service,
      category: category,
      support_type_id: supId,
      points: sup ? sup.points : 0,
      status: statusVal,
      resolved_date: statusVal==="Done" ? (resolvedVal||null) : null,
      team_id: AUTH.user.team_id,
      staff_user_id: AUTH.user.id,
      staff_name: AUTH.user.name || AUTH.user.username
    };
    let rows;
    if(remarks.length>1) rows=remarks.map(rk=>Object.assign({merchant_name:merchants[0], remark:rk}, base));
    else rows=merchants.map(m=>Object.assign({merchant_name:m, remark:(remarks[0]||null)}, base));
    await sbInsert("entries", rows);
    if(tg){ try{ tg.HapticFeedback.notificationOccurred("success"); }catch(e){} }
    const n=rows.length, pts=(sup?sup.points:0)*n;
    renderLog();
    document.getElementById("logMsg").innerHTML="<div class='notice ok'>✅ Saved "+n+" "+(n===1?"entry":"entries")+"! ("+pts+" points)</div>";
  }catch(e){
    showAlert(e.message,"Couldn't save");
    btn.disabled=false; btn.textContent="Save entry";
  }
}

function firstOfMonthISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-01"; }
async function renderMine(silent){
  const role = AUTH.user.role;
  if(!S._mine) S._mine={ from:firstOfMonthISO(), to:todayISO(), unit:"", team:"", user:"" };
  const f=S._mine;
  if(!silent) app.innerHTML="<div class='center'><span class='spin'></span></div>";
  try{
    let users=[];
    if(role!=="officer"){ users=await sbGet("users?select=id,name,username,team_id,role&active=eq.true&order=name"); }

    // teams this role may see
    let scopeTeamIds=[];
    if(role==="team_lead") scopeTeamIds = AUTH.user.team_id?[AUTH.user.team_id]:[];
    else if(role==="manager"){ const mt=S.teams.find(t=>t.id===AUTH.user.team_id); const mu=mt?mt.unit_id:null; scopeTeamIds = mu? S.teams.filter(t=>t.unit_id===mu).map(t=>t.id):[]; }
    else if(role==="admin") scopeTeamIds = S.teams.map(t=>t.id);

    // teams to query after filters
    let qTeamIds = scopeTeamIds.slice();
    if(role==="admin" && f.unit){ const uid=parseInt(f.unit,10); qTeamIds = S.teams.filter(t=>t.unit_id===uid).map(t=>t.id); }
    if(f.team){ qTeamIds=[parseInt(f.team,10)]; }

    // build query (officers are hard-locked to their OWN entries only)
    const params=["start_date=gte."+f.from,"start_date=lte."+f.to,"select=*,support_types(name)","order=start_date.desc,created_at.desc","limit=1000"];
    let noScope=false;
    if(role==="officer"){ params.push("staff_user_id=eq."+AUTH.user.id); }
    else if(f.user){ params.push("staff_user_id=eq."+parseInt(f.user,10)); }
    else {
      const restrict = (role!=="admin") || f.unit || f.team;   // admin with no filter sees ALL entries
      if(restrict){ if(qTeamIds.length) params.push("team_id=in.("+qTeamIds.join(",")+")"); else noScope=true; }
    }

    const rows = noScope? [] : await sbGet("entries?"+params.join("&"));
    const totalPts = rows.reduce((a,e)=>a+(e.points||0),0);

    app.innerHTML="";

    // ---- filter card ----
    const userTeamIds = f.team ? [parseInt(f.team,10)] : qTeamIds;
    const userOpts = users.filter(u=> userTeamIds.indexOf(u.team_id)>=0 ).map(u=>({v:u.id,t:(u.name||u.username||("User "+u.id))}));

      ctrls += `<div><label>User</label><select id="mf_user">${optList(userOpts,f.user,"All users")}</select></div>`;

/* Type-to-search combobox: filter a list by typing, pick a real item only. */
function comboField(id, placeholder){
  return '<div class="combo" id="'+id+'_c">'
    +'<input type="text" class="combo-input" id="'+id+'_txt" autocomplete="off" placeholder="'+esc(placeholder||'Type to search…')+'">'
    +'<span class="combo-caret">▾</span>'
    +'<input type="hidden" id="'+id+'">'
    +'<div class="combo-list" id="'+id+'_list"></div></div>';
}
function wireCombo(root, id, items, onSelect, initialValue){
  var wrap=(root||document).querySelector('#'+id+'_c'); if(!wrap) return;
  var txt=wrap.querySelector('#'+id+'_txt'), hid=wrap.querySelector('#'+id), list=wrap.querySelector('#'+id+'_list');
  var active=-1, shown=[];
  function render(q){
    q=(q||'').trim().toLowerCase();
    shown=items.filter(function(it){ return !q || it.label.toLowerCase().indexOf(q)>=0; });
    list.innerHTML = shown.length ? shown.map(function(it,i){ return '<div class="combo-opt" data-i="'+i+'">'+esc(it.label)+'</div>'; }).join('') : '<div class="combo-empty">No match</div>';
    active=-1;
    list.querySelectorAll('.combo-opt').forEach(function(o){
      o.addEventListener('mousedown', function(e){ e.preventDefault(); pick(shown[parseInt(o.getAttribute('data-i'),10)]); });
    });
  }
  function openAll(){ render(''); list.classList.add('open'); }
  function openFiltered(){ render(txt.value); list.classList.add('open'); }
  function close(){ list.classList.remove('open'); }
  function pick(it){ if(!it) return; hid.value=it.value; txt.value=it.label; close(); if(onSelect) onSelect(it); }
  function setActive(opts){ opts.forEach(function(o,i){ o.classList.toggle('active', i===active); }); if(opts[active]) opts[active].scrollIntoView({block:'nearest'}); }
  function resolveOnBlur(){
    var v=txt.value.trim().toLowerCase();
    if(!v){ hid.value=''; if(onSelect) onSelect(null); return; }
    var exact=items.find(function(it){ return it.label.toLowerCase()===v; });
    if(exact){ pick(exact); return; }
    var filt=items.filter(function(it){ return it.label.toLowerCase().indexOf(v)>=0; });
    if(filt.length===1){ pick(filt[0]); return; }
    hid.value=''; txt.value=''; if(onSelect) onSelect(null);
  }
  txt.addEventListener('focus', openAll);
  txt.addEventListener('input', function(){ hid.value=''; openFiltered(); });
  txt.addEventListener('blur', function(){ setTimeout(function(){ close(); resolveOnBlur(); }, 150); });
  txt.addEventListener('keydown', function(e){
    var opts=list.querySelectorAll('.combo-opt');
    if(e.key==='ArrowDown'){ e.preventDefault(); if(!list.classList.contains('open')){ openFiltered(); opts=list.querySelectorAll('.combo-opt'); } active=Math.min(opts.length-1,active+1); setActive(opts); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); active=Math.max(0,active-1); setActive(opts); }
    else if(e.key==='Enter'){ if(list.classList.contains('open') && active>=0 && shown[active]){ e.preventDefault(); pick(shown[active]); } }
    else if(e.key==='Escape'){ close(); }
  });
  if(initialValue!=null && initialValue!==''){
    var init=items.find(function(it){ return String(it.value)===String(initialValue); });
    if(init){ hid.value=init.value; txt.value=init.label; if(onSelect) onSelect(init); }
  }
}

function flagFor(pts, tgt){
  if(tgt==null) return "";
  if(pts<tgt) return '<span class="flag below">Below</span>';
  if(pts<=tgt*1.15) return '<span class="flag track">On track</span>';
  return '<span class="flag over">Over</span>';
}
function staffRowTr(u, calRow, ptsByUser, leaveByUser){
  const wd = calRow? calRow.working_days : null;
  const pts=ptsByUser[u.id]||0;
  const lvd=leaveByUser[u.id]||0;
  const noKpi = (u.role==="manager"||u.role==="admin");
  const eff = wd!=null? Math.max(0, wd-lvd) : null;
  const tgt = (!noKpi && eff!=null)? Math.round(teamDaily(u.team_id)*eff) : null;
  const tag = u.role==="team_lead"?' <span class="muted">(Lead)</span>':(u.role==="manager"?' <span class="muted">(Manager)</span>':(u.role==="admin"?' <span class="muted">(Admin)</span>':''));
  const tgtCell = noKpi? `<span class="muted">No KPI required</span>` : (tgt==null?"\u2014":tgt);
  return `<tr>
    <td>${esc(u.name||u.username||("User "+u.id))}${tag}</td>
    <td class="num">${lvd}</td>
    <td class="num">${tgtCell}</td>
    <td class="num"><b>${pts}</b></td>
    <td>${noKpi?"":flagFor(pts,tgt)}</td>
    <td class="nowrap"><button class="iconbtn" data-uid="${u.id}" title="View detail">\u{1F4CB} Detail</button></td>
  </tr>`;
}

async function renderSummary(){
  app.innerHTML="<div class='center'><span class='spin'></span></div>";
  const mk = S._month || monthKey(new Date());
  S._month = mk;
  try{
    const [y,m]=mk.split("-").map(Number);
    const from = `${mk}-01`;
    const to = nextMonthStart(mk);
    if(AUTH.user.role==="officer"){ await renderOwnSummary(mk, from, to); return; }
    const usersFull   = await sbGet("users?select=id,name,username,team_id,role&active=eq.true&order=name");
    const entriesStaff = await sbGet(`entries?select=staff_user_id,team_id,points&start_date=gte.${from}&start_date=lt.${to}&limit=5000`);
    const cal         = await sbGet(`month_calendar?select=*&month=eq.${mk}`);
    const leavesRows  = await sbGet(`leaves?month=eq.${mk}&select=staff_user_id,days`);
    const calRow = cal[0];

    const leaveByUser={}; leavesRows.forEach(l=>{ leaveByUser[l.staff_user_id]=Number(l.days)||0; });
    const ptsByUser={}, actualByTeam={};
    entriesStaff.forEach(e=>{
      if(e.staff_user_id) ptsByUser[e.staff_user_id]=(ptsByUser[e.staff_user_id]||0)+(e.points||0);
      if(e.team_id) actualByTeam[e.team_id]=(actualByTeam[e.team_id]||0)+(e.points||0);
    });
    const staffByTeam={}, leaveByTeam={}, usersByTeam={};
    usersFull.forEach(u=>{ if(u.team_id){
      (usersByTeam[u.team_id]=usersByTeam[u.team_id]||[]).push(u);
      if(u.role==="manager"||u.role==="admin") return;   // managers/admins have no KPI, exclude from team target
      staffByTeam[u.team_id]=(staffByTeam[u.team_id]||0)+1;
      leaveByTeam[u.team_id]=(leaveByTeam[u.team_id]||0)+(leaveByUser[u.id]||0);
    }});
    const myLeave = leaveByUser[AUTH.user.id]||0;

    app.innerHTML="";
    const leadLeave = AUTH.user.role==="team_lead"
      ? `<div><label>My leave (days)</label><input type="number" id="ownLeave" min="0" step="0.5" value="${myLeave}" style="max-width:120px"></div>
         <button class="btn sec" id="ownLeaveSave" style="width:auto">Save leave</button>
         <span class="muted" id="ownLeaveMsg"></span>` : "";
    const head=el(`<div class="card">
      <h2 class="sec">\u{1F4C8} Team summary</h2>
      <div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
        <div><label>Month</label><input type="month" id="mSel" value="${mk}"></div>
        ${leadLeave}
      </div>
      ${calRow?`<p class="muted" style="margin-top:8px">Working days: <b>${calRow.working_days}</b> · Holidays: <b>${calRow.holidays}</b></p>`
             :`<div class="notice err" style="margin-top:8px">No working days set for this month. Set it in Admin → Month setup.</div>`}
    </div>`);
    app.appendChild(head);
    document.getElementById("mSel").onchange=(e)=>{S._month=e.target.value;renderSummary();};
    const _lv=document.getElementById("ownLeaveSave");
    if(_lv) _lv.onclick=async()=>{
      const dd=Math.max(0,Number(document.getElementById("ownLeave").value)||0);
      const msg=document.getElementById("ownLeaveMsg");
      _lv.disabled=true; _lv.textContent="Saving…";
      try{
        const ex=await sbGet("leaves?staff_user_id=eq."+AUTH.user.id+"&month=eq."+mk+"&select=id");
        if(ex.length) await sbPatch("leaves","staff_user_id=eq."+AUTH.user.id+"&month=eq."+mk,{days:dd});
        else await sbInsert("leaves",{staff_user_id:AUTH.user.id,month:mk,days:dd});
        renderSummary();
      }catch(e){ msg.textContent="Error: "+e.message; _lv.disabled=false; _lv.textContent="Save leave"; }
    };

    let teamsToShow = S.teams;
    if(AUTH.user.role==="team_lead") teamsToShow = S.teams.filter(t=>t.id===AUTH.user.team_id);
    else if(AUTH.user.role==="manager"){
      const myTeam=S.teams.find(t=>t.id===AUTH.user.team_id);
      const myUnit=myTeam?myTeam.unit_id:null;
      teamsToShow = myUnit? S.teams.filter(t=>t.unit_id===myUnit) : [];
      if(!teamsToShow.length){
        app.appendChild(el(`<div class="card"><p class="muted">Your unit isn't set yet. Ask an admin to assign your team to a unit so you can see your unit's summary.</p></div>`));
        return;
      }
    }
    const role=AUTH.user.role;

    /* ---- team summary table (Team | Staff | Leave | Target | Actual | Flag) ---- */
    let tgtSum=0, actSum=0, rowsHtml="";
    function teamRow(t){
      const staff=staffByTeam[t.id]||0, tleave=leaveByTeam[t.id]||0, actual=actualByTeam[t.id]||0;
      let target=null;
      if(calRow){ const staffDays=calRow.working_days*staff - tleave; target=Math.max(0,Math.round(teamDaily(t.id)*Math.max(0,staffDays))); }
      if(target!=null){ tgtSum+=target; actSum+=actual; }
      rowsHtml += `<tr><td><span class="dot" style="background:${teamColor(t.id)}"></span>${esc(t.name)}</td>`
        + `<td class="num">${staff}</td><td class="num">${tleave}</td>`
        + `<td class="num">${target==null?"—":target}</td><td class="num"><b>${actual}</b></td>`
        + `<td>${flagFor(actual,target)}</td></tr>`;
    }
    if(role==="admin"){
      S.units.forEach(unit=>{ const uts=teamsToShow.filter(t=>t.unit_id===unit.id); if(!uts.length) return;
        rowsHtml += `<tr><td colspan="6" style="font-weight:700;padding-top:10px">\u{1F3E2} ${esc(unit.name)} — ${uts.length} team${uts.length>1?"s":""}</td></tr>`;
        uts.forEach(teamRow); });
      const orph=teamsToShow.filter(t=>!S.units.find(u=>u.id===t.unit_id));
      if(orph.length){ rowsHtml += `<tr><td colspan="6" style="font-weight:700;padding-top:10px">\u{1F3E2} No unit — ${orph.length} team${orph.length>1?"s":""}</td></tr>`; orph.forEach(teamRow); }
    } else {
      teamsToShow.forEach(teamRow);
    }
    if(calRow && teamsToShow.length>1){
      rowsHtml += `<tr><td><b>Total</b></td><td class="num"></td><td class="num"></td>`
        + `<td class="num"><b>${tgtSum}</b></td><td class="num"><b>${actSum}</b></td><td></td></tr>`;
    }
    const tbl=el(`<div class="card"><div style="overflow-x:auto"><table>
      <thead><tr><th>Team</th><th class="num">Staff</th><th class="num">Leave</th><th class="num">Target</th><th class="num">Actual</th><th>Flag</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div></div>`);
    app.appendChild(tbl);

    /* ---- staff listing with per-staff Detail popup ---- */
    const listCard=el(`<div class="card"><h2 class="sec">\u{1F465} Staff detail</h2><div id="staffWrap"></div></div>`);
    app.appendChild(listCard);
    const wrap=listCard.querySelector("#staffWrap");
    const colg=`<colgroup><col style="width:34%"><col style="width:11%"><col style="width:13%"><col style="width:15%"><col style="width:15%"><col style="width:12%"></colgroup>`;
    const sHead=`<thead><tr><th>Staff</th><th class="num">Leave</th><th class="num">Target</th><th class="num">Actual</th><th>Flag</th><th></th></tr></thead>`;
    const unitHdr=(txt)=>`<tr><td colspan="6" style="font-weight:700;background:rgba(99,102,241,.06);padding-top:12px">\u{1F3E2} ${esc(txt)}</td></tr>`;
    const teamHdr=(t)=>{ const n=(usersByTeam[t.id]||[]).length; return `<tr><td colspan="6" style="font-weight:600;padding-top:10px"><span class="dot" style="background:${teamColor(t.id)}"></span>${esc(t.name)} <span class="muted">(${n} staff)</span></td></tr>`; };
    const teamRows=(t)=>{ const members=usersByTeam[t.id]||[]; return members.length? members.map(u=>staffRowTr(u,calRow,ptsByUser,leaveByUser)).join("") : `<tr><td colspan="6" class="muted">No staff in this team.</td></tr>`; };
    let body="";
    if(role==="team_lead"){
      const t=teamsToShow[0];
      body = teamRows(t);
    } else if(role==="admin"){
      S.units.forEach(unit=>{ const uts=teamsToShow.filter(t=>t.unit_id===unit.id); if(!uts.length) return;
        body += unitHdr(`${unit.name} — ${uts.length} team${uts.length>1?"s":""}`);
        uts.forEach(t=>{ body += teamHdr(t) + teamRows(t); }); });
      const orph=teamsToShow.filter(t=>!S.units.find(u=>u.id===t.unit_id));
      if(orph.length){ body += unitHdr(`No unit — ${orph.length} team${orph.length>1?"s":""}`); orph.forEach(t=>{ body += teamHdr(t) + teamRows(t); }); }
    } else {
      teamsToShow.forEach(t=>{ body += teamHdr(t) + teamRows(t); });
    }
    wrap.innerHTML=`<div style="overflow-x:auto"><table class="etable fit" style="table-layout:fixed">${colg}${sHead}<tbody>${body}</tbody></table></div>`;
    const umap={}; usersFull.forEach(u=>{ umap[u.id]=u; });
    wrap.querySelectorAll("button[data-uid]").forEach(b=>{ b.onclick=()=>showStaffDetailModal(umap[parseInt(b.getAttribute("data-uid"),10)], mk); });
  }catch(e){ app.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
}

async function renderDashboard(){
  app.innerHTML="<div class='center'><span class='spin'></span></div>";
  const mk = S._dmonth || monthKey(new Date());
  S._dmonth = mk;
  try{
    const [y,m]=mk.split("-").map(Number);
    const from=`${mk}-01`, to=nextMonthStart(mk);
    const entries=await sbGet(`entries?select=team_id,points,status,staff_name,staff_user_id&start_date=gte.${from}&start_date=lt.${to}&limit=10000`);
    const users=await sbGet("users?select=team_id,active&active=eq.true");
    const cal=(await sbGet(`month_calendar?select=*&month=eq.${mk}`))[0];
    const targets=await sbGet(`monthly_targets?select=*&month=eq.${mk}`);
    const daily=parseInt(S.settings.daily_target||DAILY_DEFAULT,10);
    const leaveBy={}; targets.forEach(t=>leaveBy[t.team_id]=t.leave_days||0);
    const staffBy={}; users.forEach(u=>{ if(u.team_id) staffBy[u.team_id]=(staffBy[u.team_id]||0)+1; });
    const actualBy={}; entries.forEach(e=>{ if(e.team_id) actualBy[e.team_id]=(actualBy[e.team_id]||0)+(e.points||0); });
    const totalPoints=entries.reduce((a,e)=>a+(e.points||0),0);
    const totalTasks=entries.length;
    const activeStaff=users.length;
    const stc={Pending:0,"In Progress":0,Done:0};
    entries.forEach(e=>{ if(stc[e.status]!=null) stc[e.status]++; });
    let tgtTotal=0; const hasTarget=!!cal;
    S.teams.forEach(t=>{ if(cal){ const sd=cal.working_days*(staffBy[t.id]||0)-(leaveBy[t.id]||0); tgtTotal+=Math.max(0,Math.round(teamDaily(t.id)*Math.max(0,sd))); } });
    const pct = hasTarget && tgtTotal>0 ? Math.round(totalPoints/tgtTotal*100) : null;
    const byStaff={};
    entries.forEach(e=>{ const k=(e.staff_user_id!=null?("u"+e.staff_user_id):("n"+(e.staff_name||""))); if(!byStaff[k]) byStaff[k]={name:e.staff_name||"—",pts:0,tasks:0}; byStaff[k].pts+=(e.points||0); byStaff[k].tasks++; });
    const top=Object.values(byStaff).sort((a,b)=>b.pts-a.pts).slice(0,5);
    const maxTeam=Math.max(1,...S.teams.map(t=>actualBy[t.id]||0));

    app.innerHTML="";
    const head=el(`<div class="card"><h2 class="sec">📊 Dashboard</h2>
      <label>Month</label><input type="month" id="dSel" value="${mk}"></div>`);
    app.appendChild(head);
    document.getElementById("dSel").onchange=(e)=>{ S._dmonth=e.target.value; renderDashboard(); };

    app.appendChild(el(`<div class="tiles">
      <div class="tile"><div class="tval">${totalPoints}</div><div class="tlbl">Total points</div></div>
      <div class="tile"><div class="tval">${totalTasks}</div><div class="tlbl">Tasks logged</div></div>
      <div class="tile"><div class="tval">${activeStaff}</div><div class="tlbl">Active staff</div></div>
      <div class="tile"><div class="tval">${pct==null?"—":pct+"%"}</div><div class="tlbl">of target</div></div>
    </div>`));

    const barsHtml=S.teams.map(t=>{
      const v=actualBy[t.id]||0; const w=Math.round(v/maxTeam*100);
      return `<div class="barrow"><div class="barlbl"><span class="dot" style="background:${teamColor(t.id)}"></span>${esc(t.name)}</div>`
        +`<div class="bartrack"><div class="barfill" style="width:${w}%;background:${teamColor(t.id)}"></div></div>`
        +`<div class="barval">${v}</div></div>`;
    }).join("");
    app.appendChild(el(`<div class="card"><h2 class="sec">Points by team</h2>${barsHtml}</div>`));

    app.appendChild(el(`<div class="card"><h2 class="sec">Task status</h2>
      <div class="statrow">
        <span class="tag pending">Pending ${stc.Pending}</span>
        <span class="tag progress">In Progress ${stc["In Progress"]}</span>
        <span class="tag done">Done ${stc.Done}</span>
      </div></div>`));

    const topHtml = top.length ? top.map((p,i)=>`<div class="toprow"><div class="toprank">${i+1}</div>`
      +`<div style="flex:1">${esc(p.name)}<div class="muted">${p.tasks} tasks</div></div>`
      +`<div class="pts">${p.pts}</div></div>`).join("") : "<div class='muted'>No entries this month.</div>";
    app.appendChild(el(`<div class="card"><h2 class="sec">🏆 Top performers</h2>${topHtml}</div>`));
  }catch(e){ app.innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
}

      const tOpts=S.teams.map(t=>`<option value="${t.id}" ${t.id===u.team_id?"selected":""}>${esc(t.name)}</option>`).join("");
      const rOpts=["officer","team_lead","manager","admin"].map(r=>`<option value="${r}" ${r===u.role?"selected":""}>${roleName[r]}</option>`).join("");
      const uTeam0=S.teams.find(t=>t.id===u.team_id); const uUnit0=uTeam0?unitName(uTeam0.unit_id):"—";
      const row=el(`<div class="urow${u.active?"":" inactive"}">
        <div class="uname">${esc(u.name||u.username||("User "+u.id))}<span class="muted"> @${esc(u.username||"—")}</span>${u.active?"":' <span class="tag pending">terminated</span>'}</div>
        <div class="muted" data-uunit>${esc(uUnit0)}</div>
        <div><select data-f="team">${tOpts}</select></div>
        <div><select data-f="role">${rOpts}</select></div>
        <div class="uact">
          <button class="iconbtn" data-save="${u.id}" title="Save team / role">💾</button>
          <button class="iconbtn" data-pw="${u.id}" title="Reset password">🔑</button>
          ${u.active
            ? `<button class="iconbtn danger" data-term="${u.id}" title="Terminate (disable login)">🚫</button>`
            : `<button class="iconbtn ok" data-react="${u.id}" title="Reactivate">↩️</button>`}
        </div>
      </div>`);
      const saveU=(extra)=> sbRpc("app_save_user", Object.assign({
        p_admin_user:AUTH.user.username, p_admin_pass:AUTH.pass,
        p_user_id:u.id, p_name:u.name, p_username:u.username, p_password:"",
        p_team_id: parseInt(row.querySelector("[data-f=team]").value,10),
        p_role: row.querySelector("[data-f=role]").value,
        p_active: u.active

          b.textContent="✓"; setTimeout(()=>{b.textContent="💾";b.disabled=false;},1000);
        }catch(e){ b.disabled=false; alert("Error: "+e.message); }
      };
      row.querySelector("[data-pw]").onclick=async()=>{
        if(!(await askConfirm('Reset password for "'+(u.name||u.username)+'"? A new password is generated (this also unlocks the account if it was locked), and they set their own at next login.',{title:'Reset password',ok:'Reset'}))) return;
        const np=genUserPass();
        try{
          await saveU({p_password:np});
          try{ await sbRpc("app_flag_pw_change",{p_username:u.username}); }catch(e){}
          showCredsModal("Password reset", u.name, u.username, np, null);
        }catch(e){ alert("Error: "+e.message); }
      };
      const tbtn=row.querySelector("[data-term]");
      if(tbtn) tbtn.onclick=async()=>{ if(!(await askConfirm('Terminate "'+(u.name||u.username)+'"? They can no longer log in. Their records are kept and you can reactivate later.'))) return;
        try{ await saveU({p_active:false}); await reloadTeams(); renderAdmin(true); }catch(e){ alert("Error: "+e.message); } };
      const rbtn=row.querySelector("[data-react]");
      if(rbtn) rbtn.onclick=async()=>{ try{ await saveU({p_active:true}); renderAdmin(true); }catch(e){ alert("Error: "+e.message); } };
      const teamSel=row.querySelector("[data-f=team]");

      uList.appendChild(row);
    });
    host.insertBefore(uc, permc);
}

async function adTarget(host){
    const mkNow=monthKey(new Date());
    const mcard=el(`<div class="card"><h2 class="sec">🎯 KPI Target — monthly working days</h2>
      <div class="grid2">
        <div><label>Month</label><input type="month" id="mcMonth" value="${mkNow}"></div>
        <div><label>Public holidays (days)</label><input type="number" id="mcHol" min="0" value="0"></div>
      </div>
      <p class="muted" style="margin-top:12px">Working days (auto): <b id="mcWd" style="color:var(--accent);font-size:15px">—</b><span id="mcBreak"></span></p>
      <div id="mcMsg"></div>
      <button class="btn sec sm" id="mcSave" style="margin-top:8px">Save month</button>
      <p class="muted" style="margin-top:6px">Working days = total days − weekends (Sat/Sun) − holidays.</p>
    </div>`);
    host.appendChild(mcard);
    const mcRecompute=()=>{
      const mk=document.getElementById("mcMonth").value;
      const hol=parseInt(document.getElementById("mcHol").value,10)||0;
      if(!mk){ document.getElementById("mcWd").textContent="—"; return; }
      const dim=daysInMonth(mk), wk=weekendsInMonth(mk), wd=Math.max(0,dim-wk-hol);
      document.getElementById("mcWd").textContent=wd;
      document.getElementById("mcBreak").textContent=` (${dim} days − ${wk} weekend − ${hol} holiday)`;
    };
    const mcLoad=async()=>{
      const mk=document.getElementById("mcMonth").value;
      try{ const rows=await sbGet(`month_calendar?select=*&month=eq.${mk}`);
        document.getElementById("mcHol").value = rows[0]? (rows[0].holidays||0) : 0; }catch(e){}
      mcRecompute();
    };
    document.getElementById("mcMonth").onchange=mcLoad;
    document.getElementById("mcHol").oninput=mcRecompute;
    mcLoad();
    document.getElementById("mcSave").onclick=async()=>{
      const mk=document.getElementById("mcMonth").value; if(!mk) return;
      const hol=parseInt(document.getElementById("mcHol").value,10)||0;
      const wd=Math.max(0,daysInMonth(mk)-weekendsInMonth(mk)-hol);
      try{
        const ex=await sbGet(`month_calendar?select=month&month=eq.${mk}`);
        if(ex.length) await sbPatch("month_calendar","month=eq."+mk,{working_days:wd,holidays:hol});
        else await sbInsert("month_calendar",{month:mk,working_days:wd,holidays:hol});
        const b=document.getElementById("mcSave"); b.textContent="Saved ✓"; setTimeout(()=>b.textContent="Save month",1200);
      }catch(e){ document.getElementById("mcMsg").innerHTML="<div class='notice err'>"+esc(e.message)+"</div>"; }
    };

    // --- Daily KPI target per unit ---
    const dcard=el(`<div class="card"><h2 class="sec">🎯 Daily KPI target — per unit</h2>
      <p class="muted" style="margin:2px 0 10px">Points one staff is expected to earn per working day. Each unit can differ.</p>
      <div id="dtList"></div>
    </div>`);
    host.appendChild(dcard);
    const dtList=dcard.querySelector("#dtList");
    if(!S.units.length) dtList.innerHTML="<p class='muted'>No units yet. Add units in Admin → Units & Teams.</p>";
    S.units.forEach(u=>{
      const row=el(`<div class="row" style="align-items:flex-end;margin:6px 0">
        <div style="flex:2"><b>${esc(u.name)}</b></div>
        <div style="flex:1"><label>Daily points</label><input type="number" min="0" value="${u.daily_target!=null?u.daily_target:DAILY_DEFAULT}" data-dt="${u.id}"></div>
        <div style="flex:0 0 auto"><button class="btn sec sm" data-savdt="${u.id}">Save</button></div>
      </div>`);
      row.querySelector("[data-savdt]").onclick=async()=>{
        const v=parseInt(row.querySelector("[data-dt]").value,10); if(isNaN(v)||v<0) return;
        try{ await sbPatch("units","id=eq."+u.id,{daily_target:v}); u.daily_target=v; await reloadUnits();
          const b=row.querySelector("[data-savdt]"); b.textContent="✓"; setTimeout(()=>b.textContent="Save",1000);
        }catch(e){ alert("Error: "+e.message); }
      };
      dtList.appendChild(row);
    });
}
